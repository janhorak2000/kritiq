<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRITIK — Reálná Databáze Filmů a Her</title>
<style>
:root{--bg:#080a10;--panel:#111520;--line:#252b3a;--pastel:#c9a8ff;--mint:#8ee6d0;--gold:#e8bb45;--text:#f5f5f7;--muted:#9299aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:20px;padding-bottom:60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:24px;font-weight:900;color:var(--pastel);cursor:pointer}
.logo span{color:var(--mint)}
.nav-btns{display:flex;gap:10px;margin-bottom:15px}
.tab-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.tab-btn.active{color:#fff;background:#241d33;border-color:var(--pastel)}
input{width:100%;padding:12px;background:#171c29;border:1px solid var(--line);color:#fff;border-radius:10px;margin-bottom:20px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.title{font-size:15px;font-weight:800;margin-bottom:6px;line-height:1.2}
.meta{font-size:12px;color:var(--muted)}
.score{display:inline-block;padding:3px 7px;background:var(--gold);color:#000;font-weight:900;border-radius:6px;font-size:12px;margin-top:8px}
.btn{background:var(--line);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700;margin-bottom:15px}
.details-box{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px;margin-top:15px}
.details-box p{margin:8px 0;line-height:1.5}
.tag{color:var(--mint);font-weight:700}
a.person-link{color:var(--pastel);text-decoration:none;font-weight:700}
a.person-link:hover{text-decoration:underline}
.error-box{background:#2a1215;border:1px solid #ff4d4d;color:#ffb3b3;padding:15px;border-radius:10px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showHome()">KRITIK<span>.</span></div>
</header>

<div class="nav-btns">
  <button id="btnMovies" class="tab-btn active" onclick="switchTab('movies')">🎬 FILMY</button>
  <button id="btnGames" class="tab-btn" onclick="switchTab('games')">🎮 VIDEOHRY</button>
</div>

<input id="searchBar" placeholder="Hledat film, hru, režiséra nebo herce..." oninput="render()">

<div id="content">Načítám databázi...</div>

<script>
let database = { movies: [], games: [] };
let currentTab = "movies";

async function loadDatabase() {
  try {
    const res = await fetch("database.json");
    
    if (!res.ok) {
      throw new Error(`HTTP Chyba ${res.status}: Soubor database.json nebyl nalezen.`);
    }

    const text = await res.text();
    
    try {
      database = JSON.parse(text);
    } catch (syntaxError) {
      throw new Error(`Syntaktická chyba v JSON souboru: ${syntaxError.message}`);
    }

    render();
  } catch(e) {
    document.getElementById("content").innerHTML = `
      <div class="error-box">
        <h3>⚠️ Načítání selhalo</h3>
        <p><b>Chyba:</b> ${e.message}</p>
        <p style="font-size:13px; color:var(--muted)">
          <b>Tip:</b> Pokud spouštíte přes <code>file:///</code> (dvojklikem), webové prohlížeče blokují načítání lokálních souborů. Otevřete složku přes VS Code Live Server nebo lokální Python server.
        </p>
      </div>
    `;
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById("btnMovies").classList.toggle("active", tab === "movies");
  document.getElementById("btnGames").classList.toggle("active", tab === "games");
  render();
}

function showHome() {
  document.getElementById("searchBar").value = "";
  render();
}

function render() {
  const query = document.getElementById("searchBar").value.toLowerCase().trim();
  const list = (database[currentTab] || []).filter(item => {
    if(!query) return true;
    const tMatch = item.title && item.title.toLowerCase().includes(query);
    const dMatch = item.director && item.director.toLowerCase().includes(query);
    const devMatch = item.developer && item.developer.toLowerCase().includes(query);
    const cMatch = item.cast && item.cast.some(c => c.toLowerCase().includes(query));
    return tMatch || dMatch || devMatch || cMatch;
  });

  const content = document.getElementById("content");
  if(list.length === 0) {
    content.innerHTML = "<p style='color:var(--muted)'>Žádné položky nebyly nalezeny.</p>";
    return;
  }

  content.innerHTML = `
    <div class="grid">
      ${list.map((item) => `
        <div class="card" onclick="showProfile('${encodeURIComponent(item.title)}')">
          <div class="title">${item.title}</div>
          <div class="meta">${item.year} • ${currentTab === "movies" ? "Film" : "Hra"}</div>
          <div class="score">★ ${item.score}%</div>
        </div>
      `).join("")}
    </div>
  `;
}

function showProfile(encTitle) {
  const title = decodeURIComponent(encTitle);
  const item = (database[currentTab] || []).find(x => x.title === title);
  if(!item) return;

  const content = document.getElementById("content");
  
  if(currentTab === "movies") {
    const castLinks = (item.cast || []).map(c => `<a class="person-link" href="#" onclick="filterByPerson('${encodeURIComponent(c)}'); return false;">${c}</a>`).join(", ");
    content.innerHTML = `
      <button class="btn" onclick="render()">← Zpět na přehled</button>
      <div class="details-box">
        <h1>${item.title} (${item.year})</h1>
        <p><span class="tag">Hodnocení:</span> ★ ${item.score}%</p>
        <p><span class="tag">Režie:</span> <a class="person-link" href="#" onclick="filterByPerson('${encodeURIComponent(item.director)}'); return false;">${item.director || 'Neznámý'}</a></p>
        <p><span class="tag">Hrají:</span> ${castLinks || 'Neuvedeno'}</p>
        <p><span class="tag">Datum premiéry:</span> ${item.release || 'N/A'}</p>
        <p><span class="tag">Rozpočet:</span> ${item.budget || 'Neznámý'}</p>
        <p><span class="tag">Celosvětové tržby:</span> ${item.worldwide || 'Neznámé'}</p>
        <p><span class="tag">Odhad tržeb v ČR:</span> ${item.cz_est || 'Neznámé'}</p>
      </div>
    `;
  } else {
    content.innerHTML = `
      <button class="btn" onclick="render()">← Zpět na přehled</button>
      <div class="details-box">
        <h1>${item.title} (${item.year})</h1>
        <p><span class="tag">Hodnocení:</span> ★ ${item.score}%</p>
        <p><span class="tag">Vývojář:</span> <a class="person-link" href="#" onclick="filterByPerson('${encodeURIComponent(item.developer)}'); return false;">${item.developer || 'Neznámý'}</a></p>
        <p><span class="tag">Datum vydání:</span> ${item.release || 'N/A'}</p>
      </div>
    `;
  }
}

function filterByPerson(encPerson) {
  const person = decodeURIComponent(encPerson);
  document.getElementById("searchBar").value = person;
  render();
}

loadDatabase();
</script>
</body>
</html>
