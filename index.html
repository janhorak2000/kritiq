<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kritiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150a22;
  --bg-1:#1c0f2c;
  --bg-2:#251638;
  --bg-3:#2f1c46;
  --line:#3a2454;
  --line-soft:#2a1840;
  --text:#f1ecfa;
  --text-dim:#b6a8cf;
  --text-faint:#8577a3;
  --violet:#9b5cf6;
  --violet-2:#c084fc;
  --magenta:#e264b8;
  --s-black-bg:#0a0810; --s-black-fg:#f1ecfa;
  --s-grey-bg:#585068;  --s-grey-fg:#f1ecfa;
  --s-blue-bg:#3f6fdb;  --s-blue-fg:#ffffff;
  --s-purple-bg:#9b3ff0; --s-purple-fg:#ffffff;
  --s-gold-bg:#e8b13a;  --s-gold-fg:#1c1204;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-display:'Unbounded', 'Manrope', sans-serif;
  --font-body:'Manrope', sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 12% -8%, #341f52 0%, transparent 60%),
    radial-gradient(900px 700px at 105% 15%, #2a1440 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--violet); color:#fff;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px; width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
:focus-visible{outline:2px solid var(--violet-2); outline-offset:2px; border-radius:4px;}

.wrap{max-width:1240px; margin:0 auto; padding:0 28px;}
@media(max-width:720px){.wrap{padding:0 16px;}}

/* ---------- HEADER ---------- */
header.site{
  position:sticky; top:0; z-index:50;
  background:rgba(21,10,34,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.header-row{
  max-width:1240px; margin:0 auto; padding:12px 28px;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:22px;
}
@media(max-width:720px){.header-row{padding:10px 16px; gap:12px;}}
.brand-col{position:relative; display:inline-flex; align-items:center; justify-self:start;}
.brand{
  display:flex; align-items:center; gap:4.5px;
  font-family:var(--font-display); font-weight:800; font-size:20px;
  letter-spacing:.02em; text-transform:uppercase; white-space:nowrap;
}
.brand .dot{width:9px; height:9px; border-radius:3px; background:linear-gradient(135deg,var(--violet-2),var(--magenta)); box-shadow:0 0 14px rgba(192,132,252,.7);}
.brand-marks{display:flex; flex-direction:column; gap:2px; justify-content:center; flex:0 0 auto;}
.brand-marks .mark{width:4px; height:4px; border-radius:1px;}
.brand-marks .mark-gold{background:var(--s-gold-bg); box-shadow:0 0 8px rgba(232,177,58,.65);}
.brand-marks .mark-purple{background:var(--violet-2); box-shadow:0 0 8px rgba(192,132,252,.65);}
.brand-marks .mark-blue{background:var(--s-blue-bg); box-shadow:0 0 8px rgba(63,111,219,.65);}

/* auth badge floats below the logo, overlapping the header's bottom border — not part of
   the header's own box, same peek-out trick as the Top 10 rank numbers on the cards. */
#authBadgeWrap{position:absolute; top:100%; left:0; z-index:5; margin-top:2px;}

.auth-badge-login{
  font-family:var(--font-body); font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:4px 11px; border-radius:999px; border:1px solid rgba(192,132,252,.42);
  background:var(--bg-1); color:#c9aef2; cursor:pointer; text-transform:uppercase;
  min-width:85px; text-align:center; box-sizing:border-box;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  transition:color .15s, border-color .15s, background .15s;
}
.auth-badge-login:hover{color:#fff; border-color:var(--violet);}
.auth-badge-user{display:flex; align-items:center; gap:5px;}
.auth-badge-name{
  font-family:var(--font-body); font-size:12px; font-weight:700; max-width:115px; min-width:85px;
  padding:4px 11px; border-radius:999px; border:1px solid rgba(192,132,252,.42);
  background:var(--bg-1); color:#c9aef2; cursor:pointer; text-align:center; box-sizing:border-box;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  transition:color .15s, border-color .15s;
}
.auth-badge-name:hover{color:#fff; border-color:var(--violet);}
.auth-badge-logout{
  width:18px; height:18px; border-radius:50%; flex:0 0 auto; padding:0;
  border:1px solid rgba(239,68,68,.35); background:rgba(239,68,68,.16); color:#f16060;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  transition:background .15s, border-color .15s;
}
.auth-badge-logout svg{width:9px; height:9px;}
.auth-badge-logout:hover{background:rgba(239,68,68,.3); border-color:#f16060;}
.auth-badge-achievements{
  border-color:rgba(96,165,250,.4); background:rgba(96,165,250,.16); color:#7db4fb;
  font-size:10px; font-weight:800; font-family:var(--font-display);
}
.auth-badge-achievements:hover{background:rgba(96,165,250,.3); border-color:#7db4fb;}
.auth-badge-quests{
  border-color:rgba(232,177,58,.45); background:rgba(232,177,58,.18); color:#e8b13a;
  font-size:10px; font-weight:800; font-family:var(--font-display);
}
.auth-badge-quests:hover{background:rgba(232,177,58,.32); border-color:#e8b13a;}

.ach-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px;}
.ach-card{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  padding:14px 10px; border-radius:var(--radius-l); background:var(--bg-2);
  border:1px solid var(--line-soft); transition:border-color .15s, background .15s;
}
.ach-badge{
  width:52px; height:52px; border-radius:14px; background:var(--bg-1); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--text-faint);
  filter:grayscale(1); opacity:.55; transition:filter .2s, opacity .2s, border-color .2s, box-shadow .2s;
}
.ach-icon-text{font-family:var(--font-display); font-weight:800; font-size:11px; line-height:1.1; color:inherit;}
.ach-name{font-weight:700; font-size:12.5px; color:var(--text-dim);}
.ach-desc{font-size:11px; color:var(--text-faint); line-height:1.35;}
.ach-card.ach-done{border-color:var(--violet); background:linear-gradient(135deg, rgba(96,165,250,.1), var(--bg-2) 60%);}
.ach-card.ach-done .ach-badge{
  filter:none; opacity:1; border-color:#60a5fa; color:#fff;
  box-shadow:0 0 14px rgba(96,165,250,.6), 0 3px 10px rgba(0,0,0,.4);
}
.ach-card.ach-done .ach-name{color:var(--text);}

.quest-card{
  padding:12px 14px; border-radius:var(--radius-l); background:var(--bg-2);
  border:1px solid var(--line-soft); margin-bottom:10px; transition:border-color .15s, background .15s;
}
.quest-card:last-child{margin-bottom:0;}
.quest-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px;}
.quest-label{font-size:13px; color:var(--text-dim); line-height:1.35;}
.quest-xp{font-size:11px; font-weight:800; color:var(--text-faint); white-space:nowrap; flex:0 0 auto;}
.quest-bar-track{height:7px; border-radius:999px; background:var(--bg-1); overflow:hidden;}
.quest-bar-fill{height:100%; background:linear-gradient(90deg, #b98a1f, var(--s-gold-fg,#e8b13a)); border-radius:999px; transition:width .3s;}
.quest-count{font-size:10.5px; color:var(--text-faint); margin-top:5px; text-align:right;}
.quest-card.quest-done{border-color:#e8b13a; background:linear-gradient(135deg, rgba(232,177,58,.12), var(--bg-2) 60%);}
.quest-card.quest-done .quest-label{color:var(--text);}
.quest-card.quest-done .quest-xp{color:#e8b13a;}
.quest-card.quest-done .quest-bar-fill{box-shadow:0 0 10px rgba(232,177,58,.6);}

nav.main-nav{
  justify-self:center; display:flex; gap:6px;
}
nav.main-nav a{
  padding:9px 18px; border-radius:999px; font-size:12px; font-weight:700;
  font-family:var(--font-display); letter-spacing:.02em;
  color:var(--text-dim); transition:color .15s, background .15s;
}
nav.main-nav a:hover{color:var(--text); background:var(--bg-2);}
nav.main-nav a.active{color:#fff; background:linear-gradient(135deg,var(--violet),var(--magenta)); box-shadow:0 4px 18px rgba(155,92,246,.35);}
.search-toggle{
  justify-self:end; width:38px; height:38px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim);
  cursor:pointer; transition:color .15s, border-color .15s, background .15s;
}
.search-toggle svg{width:17px; height:17px;}
.search-toggle:hover{color:#fff; border-color:var(--violet);}
.search-toggle.active{color:#fff; border-color:var(--violet); background:rgba(155,92,246,.18);}

.search-panel{max-height:0; overflow:hidden; transition:max-height .22s ease;}
.search-panel.open{max-height:440px; border-top:1px solid var(--line-soft);}
.search-panel-inner{max-width:1240px; margin:0 auto; padding:16px 28px 20px;}
.search-panel-box{
  display:flex; align-items:center; gap:10px;
  background:var(--bg-2); border:1px solid var(--line-soft); border-radius:999px; padding:10px 16px;
}
.search-panel-box svg{flex:0 0 auto; opacity:.6;}
.search-panel-box input{
  flex:1; background:none; border:none; outline:none; color:var(--text);
  font-family:inherit; font-size:14.5px;
}
.search-panel-box input::placeholder{color:var(--text-faint);}
.search-panel-results{margin-top:12px; display:flex; flex-direction:column; gap:3px; max-height:320px; overflow-y:auto;}
.search-result-row{
  display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:10px;
  transition:background .12s;
}
.search-result-row:hover{background:var(--bg-2);}
.srr-title{flex:1; min-width:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.srr-meta{flex:0 0 auto; font-size:11.5px; color:var(--text-faint);}
.srr-score{
  flex:0 0 auto; min-width:32px; height:26px; padding:0 7px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:12.5px;
}
.search-empty-note{color:var(--text-faint); font-size:13.5px; padding:14px 4px;}
.person-search-avatar{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:13px; color:#fff;
}
.person-search-avatar .avatar-photo{width:100%; height:100%; object-fit:cover;}
.search-result-person .srr-title{font-weight:600;}
.person-search-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px;}
.person-search-item{
  display:flex; align-items:center; gap:9px; padding:7px 14px 7px 7px; border-radius:999px;
  background:var(--bg-2); border:1px solid var(--line-soft); transition:border-color .15s, background .15s;
}
.person-search-item:hover{border-color:var(--violet); background:var(--bg-1);}
.person-search-item .person-search-avatar{width:32px; height:32px; font-size:14px;}
.person-search-name{font-size:13px; font-weight:600; color:var(--text);}
@media(max-width:900px){
  nav.main-nav a{padding:9px 12px; font-size:11.5px;}
}
@media(max-width:640px){
  .header-row{gap:8px;}
  .brand{font-size:17px;}
  .auth-badge-name{max-width:80px; font-size:11px;}
  nav.main-nav{gap:2px;}
  nav.main-nav a{padding:8px 10px; font-size:11px;}
  .search-panel-inner{padding:14px 16px 18px;}
}

/* ---------- MAIN ---------- */
#app{padding-top:13px; padding-bottom:80px;}
.page-title{
  font-family:var(--font-display); font-weight:800; font-size:30px;
  margin:0 0 4px;
}
.page-sub{color:var(--text-faint); font-size:14.5px; margin:0 0 26px;}

/* ---------- HOME ROWS ---------- */
.comment-banner-wrap{position:relative; margin-bottom:4px;}
.comment-banner-slide{
  position:relative;
  background:linear-gradient(135deg, rgba(167,139,250,.14), var(--bg-1) 60%);
  border:1px solid var(--line-soft); border-radius:var(--radius-l);
  padding:12px 16px 12px 34px; cursor:pointer; transition:border-color .15s, background .15s;
  animation:bannerFadeIn .4s ease; touch-action:pan-y; overflow:hidden;
}
.comment-banner-slide:hover{border-color:var(--violet); background:linear-gradient(135deg, rgba(167,139,250,.22), var(--bg-2) 60%);}
@keyframes bannerFadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.comment-banner-label{font-size:11px; color:var(--text-faint); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.comment-banner-label b{font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--violet-2);}
.comment-banner-target{font-weight:700; font-size:13.5px; color:var(--text); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.comment-banner-score{
  float:right; margin:0 0 8px 10px;
  min-width:34px; height:26px; padding:0 7px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.comment-banner-text{
  font-size:12.5px; color:var(--text-dim); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.banner-arrow{
  position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(20,14,32,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  color:#fff; display:flex; align-items:center; justify-content:center;
  opacity:.7; transition:opacity .15s, background .15s;
}
.banner-arrow:hover{opacity:1; background:rgba(20,14,32,.85);}
.banner-arrow.left{left:-4px;}
.banner-arrow.right{right:-4px;}
.comment-banner-dots{display:flex; justify-content:center; gap:6px; margin-top:6px;}
.banner-dot{width:6px; height:6px; border-radius:50%; border:none; padding:0; background:var(--line); cursor:pointer; transition:background .15s, transform .15s;}
.banner-dot.active{background:var(--violet-2); transform:scale(1.3);}
@media(max-width:520px){
  .comment-banner-slide{padding:10px 14px;}
  .banner-arrow, .comment-banner-dots{display:none;}
}
.hot-section{margin-bottom:20px;}
.hot-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px;}
.hot-head h2{font-family:var(--font-display); font-weight:600; font-size:12px; margin:0; color:#b3a0d9;}
.hot-head .see-all{font-size:13px; font-weight:700; color:var(--violet-2); white-space:nowrap; flex:0 0 auto;}
.hot-row-wrap{position:relative;}
.hot-row{
  display:flex; gap:10px; overflow-x:auto; padding:6px 2px 6px;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; -ms-overflow-style:none;
}
.hot-row::-webkit-scrollbar{display:none;}
.hot-scroll-arrow{
  position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(20,14,32,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  color:#fff; display:flex; align-items:center; justify-content:center;
  opacity:.7; transition:opacity .15s, background .15s;
}
.hot-scroll-arrow:hover{opacity:1; background:rgba(20,14,32,.85);}
.hot-scroll-arrow.left{left:-6px;}
.hot-scroll-arrow.right{right:-6px;}
.hot-card{
  position:relative; flex:0 0 auto; width:150px; scroll-snap-align:start;
}
.hot-card .card{position:relative; z-index:1; margin-right:26px;}

.skeleton-home{padding-top:4px;}
.skeleton-row-title{width:200px; height:14px; border-radius:5px; background:var(--bg-2); margin:0 0 14px; animation:skeletonPulse 1.4s ease-in-out infinite;}
.skeleton-row{display:flex; gap:26px; overflow:hidden; margin-bottom:28px;}
.skeleton-card{flex:0 0 auto; width:150px; height:225px; border-radius:var(--radius-m); background:var(--bg-2); animation:skeletonPulse 1.4s ease-in-out infinite;}
.skeleton-card:nth-child(2){animation-delay:.08s;}
.skeleton-card:nth-child(3){animation-delay:.16s;}
.skeleton-card:nth-child(4){animation-delay:.24s;}
.skeleton-card:nth-child(5){animation-delay:.32s;}
.skeleton-card:nth-child(6){animation-delay:.4s;}
@keyframes skeletonPulse{0%,100%{opacity:.5;} 50%{opacity:1;}}
@media(max-width:640px){
  .skeleton-card{width:110px; height:165px;}
  .skeleton-row{gap:14px;}
}
.skeleton-list-title{width:220px; height:30px; border-radius:6px; background:var(--bg-2); margin:0 0 12px; animation:skeletonPulse 1.4s ease-in-out infinite;}
.skeleton-list-sub{width:340px; max-width:70%; height:14px; border-radius:5px; background:var(--bg-2); margin:0 0 26px; animation:skeletonPulse 1.4s ease-in-out infinite;}
.skeleton-card-grid{border-radius:var(--radius-m); overflow:hidden;}
.skeleton-card-grid-inner{aspect-ratio:2/3; width:100%; background:var(--bg-2); animation:skeletonPulse 1.4s ease-in-out infinite;}
.skeleton-card-grid:nth-child(3n+2) .skeleton-card-grid-inner{animation-delay:.1s;}
.skeleton-card-grid:nth-child(3n+3) .skeleton-card-grid-inner{animation-delay:.2s;}
.hot-rank{
  position:absolute; right:14px; bottom:-6px; z-index:2;
  font-family:var(--font-display); font-weight:800; font-size:48px;
  color:var(--bg); -webkit-text-stroke:1.5px var(--line);
  line-height:1; pointer-events:none; opacity:.9;
}
@media(max-width:520px){
  .hot-section{margin-bottom:16px;}
  .hot-head h2{font-size:11px;}
  .hot-row{gap:7px;}
  .hot-card{width:96px;}
  .hot-card .card{margin-right:12px;}
  .hot-rank{font-size:26px; right:9px; bottom:-3px;}
  .hot-scroll-arrow{display:none;}
  .poster .letter{font-size:36px;}
  .card-title{font-size:11px;}
  .card-meta{font-size:10px;}
  .score-chip{height:20px; min-width:26px; font-size:10.5px;}
}

/* ---------- CARDS ---------- */
.card{
  display:block; border-radius:var(--radius-m); overflow:hidden;
  background:var(--bg-2); border:1px solid var(--line-soft);
  transition:transform .18s ease, border-color .18s ease;
}
.card:hover{transform:translateY(-4px); border-color:var(--line);}
.poster{
  position:relative; aspect-ratio:2/3; width:100%; overflow:hidden;
}
.poster .letter{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:64px; color:rgba(255,255,255,.22);
}
.poster-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.poster .scrim{
  position:absolute; left:0; right:0; bottom:0; height:56%;
  background:linear-gradient(to top, rgba(10,6,18,.92), transparent);
}
.score-chip{
  position:absolute; top:8px; right:8px; z-index:3;
  min-width:34px; height:26px; padding:0 7px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.new-badge{
  position:absolute; top:8px; left:8px; z-index:3;
  background:var(--magenta); color:#fff; font-size:10px; font-weight:800;
  padding:3px 7px; border-radius:6px; letter-spacing:.03em;
}
.card-body{position:absolute; left:0; right:0; bottom:0; padding:9px 10px 10px;}
.card-title{font-size:13.5px; font-weight:700; line-height:1.2; margin:0; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 1px 8px rgba(0,0,0,.5);}
.card-meta{font-size:11.5px; color:var(--text-dim); margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 1px 8px rgba(0,0,0,.5);}

/* score color classes */
.s-black{background:var(--s-black-bg); color:var(--s-black-fg); border:1px solid #2a2236;}
.s-grey{background:var(--s-grey-bg); color:var(--s-grey-fg);}
.s-blue{background:var(--s-blue-bg); color:var(--s-blue-fg);}
.s-purple{background:var(--s-purple-bg); color:var(--s-purple-fg);}
.s-gold{background:var(--s-gold-bg); color:var(--s-gold-fg); box-shadow:0 0 16px rgba(232,177,58,.55), 0 3px 10px rgba(0,0,0,.4);}

/* ---------- FILTER BAR ---------- */
.filterbar{
  position:relative;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  padding:16px 20px; margin-bottom:26px;
}
.filterbar .label{font-size:12.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}

/* Floats above the filterbar's edge, absolutely positioned so it never affects the
   bar's own layout/height — same visual language as the header login badge. */
.platform-filter-wrap{position:absolute; top:-14px; right:16px; z-index:15;}
.platform-filter-btn{
  font-family:var(--font-body); font-size:10.5px; font-weight:800; letter-spacing:.02em;
  padding:4px 12px; border-radius:999px; border:1px solid rgba(192,132,252,.42);
  background:var(--bg-1); color:#c9aef2; cursor:pointer; white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  transition:color .15s, border-color .15s;
}
.platform-filter-btn:hover{color:#fff; border-color:var(--violet);}
.platform-dropdown{
  position:absolute; top:100%; right:0; margin-top:8px; z-index:20;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  box-shadow:0 16px 34px -10px rgba(0,0,0,.55);
  max-height:340px; overflow-y:auto; min-width:200px;
  display:none;
}
.platform-dropdown.open{display:block;}
.platform-option{
  display:block; width:100%; text-align:left; padding:9px 16px; background:none; border:none;
  color:var(--text-dim); font-size:13px; font-family:inherit; cursor:pointer;
}
.platform-option:hover{background:var(--bg-2); color:var(--text);}
.platform-option.active{color:var(--violet-2); font-weight:700;}
@media(max-width:640px){
  .platform-filter-wrap{position:static; margin-bottom:10px; width:100%;}
  .platform-dropdown{left:0; right:auto;}
}

.range-field{display:flex; align-items:center; gap:12px; flex:1 1 260px; min-width:220px;}
.range-track{position:relative; flex:1; height:4px; background:var(--line); border-radius:4px;}
.range-track .fill{position:absolute; height:100%; background:linear-gradient(90deg,var(--violet),var(--magenta)); border-radius:4px;}
.range-field input[type=range]{
  position:absolute; left:0; top:-9px; width:100%; margin:0;
  -webkit-appearance:none; appearance:none; background:none; pointer-events:none; height:22px;
}
.range-field input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; pointer-events:all;
  width:18px; height:18px; border-radius:50%;
  background:#fff; border:3px solid var(--violet);
  cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.range-field input[type=range]::-moz-range-thumb{
  pointer-events:all; width:12px; height:12px; border-radius:50%;
  background:#fff; border:3px solid var(--violet); cursor:pointer;
}
.range-wrap{position:relative; flex:1; height:4px;}
.year-readout{font-family:var(--font-display); font-weight:700; font-size:14.5px; white-space:nowrap; color:var(--text);}
.sortsel{
  margin-left:auto; background:var(--bg-2); color:var(--text); border:1px solid var(--line-soft);
  border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; font-family:inherit;
}

/* ---------- GRID ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(158px,1fr)); gap:18px;
}
.empty-note{color:var(--text-faint); padding:40px 0; text-align:center; font-size:14px;}
.load-more-wrap{display:flex; justify-content:center; padding:30px 0 10px;}
.load-more-btn{
  padding:11px 26px; border-radius:999px; cursor:pointer;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text);
  font-weight:700; font-size:13.5px; transition:border-color .15s, background .15s;
}
.load-more-btn:hover{background:var(--bg-3); border-color:var(--violet);}

/* ---------- DETAIL ---------- */
.detail-top{margin-bottom:38px;}
.detail-top--notag{margin-top:4px;}
.detail-header{margin-bottom:22px;}
.detail-header h1{font-family:var(--font-display); font-weight:800; font-size:clamp(26px,4vw,40px); margin:0 0 8px; line-height:1.05;}
.admin-edit-btn{
  display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;
  width:30px; height:30px; margin-left:10px; border-radius:50%; border:1px solid var(--line-soft);
  background:var(--bg-2); color:var(--text-faint); font-size:14px; cursor:pointer;
  transition:color .15s, border-color .15s, background .15s;
}
.admin-edit-btn:hover{color:#fff; border-color:var(--violet); background:var(--bg-1);}
.detail-meta-line{color:var(--text-dim); font-size:14.5px; margin-bottom:0; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.top10-add-btn{
  display:inline-flex; align-items:center; font-size:inherit; font-weight:700; line-height:1;
  padding:5px 14px; border-radius:999px; border:1px solid rgba(167,139,250,.55);
  background:rgba(167,139,250,.16); color:#c9b6fb; cursor:pointer; white-space:nowrap;
  box-shadow:0 0 12px rgba(167,139,250,.45);
  transition:background .15s, box-shadow .15s, border-color .15s;
}
.top10-add-btn:hover{background:rgba(167,139,250,.28); box-shadow:0 0 18px rgba(167,139,250,.65);}
.top10-add-btn.in-list{background:rgba(167,139,250,.32); border-color:rgba(167,139,250,.8);}
.top10-slots{display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow-y:auto;}
.top10-slot-btn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 14px; border-radius:var(--radius-m); border:1px solid var(--line-soft);
  background:var(--bg-1); color:var(--text); cursor:pointer; font-size:13.5px;
  transition:background .12s, border-color .12s;
}
.top10-slot-btn:hover{background:var(--bg-2); border-color:var(--violet);}
.top10-slot-btn.active{border-color:var(--violet); background:rgba(167,139,250,.18);}
.top10-slot-num{font-weight:800; color:var(--violet-2); flex:0 0 22px;}
.top10-slot-title{color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.top10-view-list{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
.top10-view-item{display:block; padding:8px 4px; color:var(--text); text-decoration:none; font-size:13.5px; border-bottom:1px solid var(--line-soft);}
.top10-view-item:hover{color:var(--violet-2);}
.detail-meta-line .sep{opacity:.4;}

.detail-row{display:flex; align-items:flex-start; gap:20px; margin-bottom:22px;}
.credits{display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-width:0;}
.detail-poster-summary-row{display:flex; align-items:stretch; gap:20px; margin-bottom:22px; height:270px;}
.detail-poster-large{flex:0 0 180px; width:180px; height:100%; cursor:pointer;}
.detail-poster-large .frame{
  border-radius:var(--radius-m); overflow:hidden; width:100%; height:100%;
  position:relative; box-shadow:0 14px 30px -10px rgba(0,0,0,.6), 0 0 0 1px var(--line-soft);
}
.detail-poster-large .frame::after{content:''; position:absolute; inset:0; box-shadow:inset 0 0 30px rgba(0,0,0,.35);}
.detail-poster-large .frame .letter{font-size:56px;}
@media(max-width:480px){
  .detail-poster-summary-row{height:180px;}
  .detail-poster-large{flex-basis:120px; width:120px;}
  .detail-poster-large .frame .letter{font-size:38px;}
}
.summary-box-inline{
  position:relative; font-size:13px; color:var(--text-dim); line-height:1.6;
  flex:1 1 auto; min-width:0; height:100%; overflow:hidden; cursor:pointer;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  padding:14px 18px; transition:border-color .15s, background .15s;
}
.summary-box-inline::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:2em;
  background:linear-gradient(to top, var(--bg-1), transparent);
  border-radius:0 0 var(--radius-m) var(--radius-m);
}
.summary-box-inline:hover{border-color:var(--violet); background:var(--bg-2);}
.credit-row{display:flex; gap:10px; font-size:14px; align-items:baseline; flex-wrap:wrap;}
.credit-row .ck-label{color:var(--text-faint); min-width:96px; font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; padding-top:3px;}
.credit-row .ck-values{display:flex; gap:6px; flex-wrap:wrap;}
.person-link{
  color:var(--violet-2); font-weight:600; padding:3px 10px; border-radius:999px;
  background:rgba(155,92,246,.12); border:1px solid rgba(155,92,246,.28);
  transition:background .15s, color .15s;
}
.person-link:hover{background:rgba(155,92,246,.28); color:#fff;}

.detail-poster-small{flex:0 0 108px; width:108px; align-self:flex-start; margin-left:auto; cursor:pointer;}
.detail-poster-small:hover .frame{transform:rotate(-2deg) scale(1.03);}
@media(max-width:480px){.detail-poster-small{flex-basis:76px; width:76px;}}
.detail-poster-small .frame{
  aspect-ratio:2/3; border-radius:var(--radius-m); overflow:hidden; width:100%;
  position:relative; transform:rotate(-2deg); box-shadow:0 14px 30px -10px rgba(0,0,0,.6), 0 0 0 1px var(--line-soft);
  transition:transform .15s ease;
}
.detail-poster-small .frame::after{content:''; position:absolute; inset:0; box-shadow:inset 0 0 30px rgba(0,0,0,.35);}
.detail-poster-small .frame .letter{font-size:40px;}
@media(max-width:480px){.detail-poster-small .frame .letter{font-size:28px;}}

.summary-box{
  position:relative; font-size:13px; color:var(--text-dim); line-height:1.55;
  height:4.65em; overflow:hidden; cursor:pointer;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  padding:12px 16px; margin-top:16px; transition:border-color .15s, background .15s;
}
.summary-box::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:1.8em;
  background:linear-gradient(to top, var(--bg-1), transparent);
  border-radius:0 0 var(--radius-m) var(--radius-m);
}
.summary-box:hover{border-color:var(--violet); background:var(--bg-2);}
.cast-hidden-row{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line-soft);}
.show-all-cast-wrap{margin-top:16px;}
.show-all-cast-btn{
  font-family:var(--font-body); font-size:12.5px; font-weight:800; letter-spacing:.02em;
  padding:8px 18px; border-radius:999px; border:1px solid rgba(192,132,252,.55);
  background:rgba(155,92,246,.16); color:#e4d4fc; cursor:pointer;
  box-shadow:0 0 14px rgba(192,132,252,.35);
  transition:background .15s, color .15s, box-shadow .2s, border-color .15s;
}
.show-all-cast-btn:hover{
  background:rgba(155,92,246,.28); color:#fff; border-color:var(--violet-2);
  box-shadow:0 0 22px rgba(192,132,252,.6);
}
.summary-box:hover::after{background:linear-gradient(to top, var(--bg-2), transparent);}

.score-bar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:18px 26px; border-radius:var(--radius-l); margin-bottom:10px;
}
.score-bar .num{font-family:var(--font-display); font-weight:800; font-size:42px; line-height:1;}
.score-bar .lbl{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
.score-bar .votes{font-size:12.5px; opacity:.8; margin-left:auto;}
.score-na-note{font-size:12.5px; color:var(--text-faint); margin:0 0 22px; font-style:italic;}
@media(max-width:520px){.score-bar{padding:14px 18px;} .score-bar .num{font-size:34px;}}

.section-title{font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 14px;}
.section-subtitle{font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px;}
.block{margin-bottom:36px;}
.synopsis{color:var(--text-dim); font-size:15px; line-height:1.65; max-width:74ch;}

/* rate widget: slider with colored readout */
.rate-slider-row{display:flex; align-items:center; gap:18px; margin-bottom:18px;}
.rate-num{
  flex:0 0 auto; min-width:58px; height:44px; padding:0 10px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:19px;
  transition:background .12s, color .12s;
}
.rate-track-wrap{flex:1; min-width:0; display:flex; align-items:center; height:26px;}
.rate-track-wrap input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; margin:0; cursor:pointer;
  background:linear-gradient(to right,
    var(--s-black-bg) 0%, var(--s-black-bg) 1%,
    var(--s-grey-bg) 1%, var(--s-grey-bg) 49%,
    var(--s-blue-bg) 49%, var(--s-blue-bg) 69%,
    var(--s-purple-bg) 69%, var(--s-purple-bg) 89%,
    var(--s-gold-bg) 89%, var(--s-gold-bg) 100%);
}
.rate-track-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:24px; height:24px; border-radius:50%;
  background:var(--thumb-color, #fff); border:3px solid #fff;
  box-shadow:0 2px 10px rgba(0,0,0,.5); cursor:pointer;
}
.rate-track-wrap input[type=range]::-moz-range-track{
  height:8px; border-radius:999px;
  background:linear-gradient(to right,
    var(--s-black-bg) 0%, var(--s-black-bg) 1%,
    var(--s-grey-bg) 1%, var(--s-grey-bg) 49%,
    var(--s-blue-bg) 49%, var(--s-blue-bg) 69%,
    var(--s-purple-bg) 69%, var(--s-purple-bg) 89%,
    var(--s-gold-bg) 89%, var(--s-gold-bg) 100%);
}
.rate-track-wrap input[type=range]::-moz-range-thumb{
  width:20px; height:20px; border-radius:50%; border:3px solid #fff;
  background:var(--thumb-color, #fff); box-shadow:0 2px 10px rgba(0,0,0,.5); cursor:pointer;
}
.review-form textarea{
  width:100%; min-height:96px; resize:none; overflow:hidden; box-sizing:border-box; border-radius:var(--radius-m);
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text);
  padding:14px 16px; font-family:inherit; font-size:14.5px; line-height:1.5; outline:none;
}
.review-form textarea:focus{border-color:var(--violet);}
.review-form{background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-l); padding:22px;}
.review-submit{
  margin-top:12px; padding:10px 22px; border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:14px;
}
.review-submit:disabled{opacity:.4; cursor:not-allowed;}
.form-note{font-size:12.5px; color:var(--text-faint); margin-top:8px;}

.reviews-list{display:flex; flex-direction:column; gap:12px; margin-top:20px;}
.review-item{
  display:flex; gap:14px; padding:16px 18px; border-radius:var(--radius-m);
  background:var(--bg-1); border:1px solid var(--line-soft);
  cursor:pointer; transition:border-color .15s, background .15s;
}
.review-item:hover{border-color:var(--violet); background:var(--bg-2);}
.review-score{
  flex:0 0 auto; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:15px;
}
.review-body{min-width:0; flex:1 1 auto;}
.review-author-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; flex-wrap:wrap;}
.review-author-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.review-own-actions-row{display:flex; gap:8px; margin-bottom:8px;}
.pill-edit-btn, .pill-delete-btn{
  font-family:var(--font-body); font-size:10.5px; font-weight:800; letter-spacing:.03em;
  padding:4px 12px; border-radius:999px; border:none; cursor:pointer;
  transition:filter .15s, transform .1s;
}
.pill-edit-btn{background:#e8c93a; color:#231a02;}
.pill-edit-btn:hover{filter:brightness(1.1);}
.pill-delete-btn{background:#e2495a; color:#fff;}
.pill-delete-btn:hover{filter:brightness(1.1);}
.pill-edit-btn:active, .pill-delete-btn:active{transform:scale(.96);}
.review-author-link, .review-context-link{font-weight:700; font-size:13.5px; color:var(--text); text-decoration:none;}
.review-author-link:hover, .review-context-link:hover{color:var(--violet-2); text-decoration:underline;}
.review-timestamp{font-size:12px; color:var(--text-faint); font-weight:400;}
.review-edited-note{font-style:italic;}
.review-context-link{color:var(--text-dim); font-weight:600;}
.review-reactions-mini{display:flex; align-items:center; gap:12px; flex:0 0 auto;}
.mini-react{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-faint); font-weight:600;}
.mini-react svg{width:13px; height:13px;}
.review-text{
  color:var(--text-dim); font-size:14px; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}

/* review modal */
.modal-overlay{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  background:rgba(8,4,14,.7); backdrop-filter:blur(6px); padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  width:100%; max-width:540px; max-height:86vh; overflow-y:auto;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-l);
  padding:26px 26px 22px; position:relative;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
}
.modal-close{
  position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; line-height:1;
}
.modal-close:hover{color:#fff; border-color:var(--violet);}
.modal-review-head{display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-right:36px;}
.modal-review-score{
  flex:0 0 auto; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:18px;
}
.modal-review-author{font-weight:700; font-size:15px; color:var(--text); text-decoration:none;}
.modal-review-author:hover{color:var(--violet-2); text-decoration:underline;}
.modal-review-text{color:var(--text-dim); font-size:15px; line-height:1.65; margin-bottom:22px; white-space:pre-wrap;}
.modal-react-row{display:flex; gap:8px; flex-wrap:nowrap;}
.react-btn{
  display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 12px; border-radius:999px; cursor:pointer;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim);
  font-family:inherit; font-weight:700; font-size:13px; white-space:nowrap;
  flex:1 1 0; min-width:0; transition:background .12s, color .12s, border-color .12s;
}
.react-btn svg{flex:0 0 auto; width:16px; height:16px;}
.react-btn span{overflow:hidden; text-overflow:ellipsis;}
.react-btn:hover{color:#fff; border-color:var(--line);}
.react-btn.active-like{background:rgba(63,111,219,.22); border-color:var(--s-blue-bg); color:#bcd0ff;}
.react-btn.active-dislike{background:rgba(88,80,104,.3); border-color:var(--s-grey-bg); color:#e7e2f0;}
.react-btn.active-funny{background:rgba(232,177,58,.2); border-color:var(--s-gold-bg); color:#ffdd8a;}
@media(max-width:480px){
  .modal-react-row{gap:6px;}
  .react-btn{padding:9px 6px; font-size:11px; gap:4px;}
  .react-btn svg{width:13px; height:13px;}
  .modal-card{padding:20px 18px 18px;}
}
@media(max-width:360px){
  .react-btn{font-size:0;}
  .react-btn span{font-size:11px;}
}
.modal-card.wide{max-width:680px;}

/* auth (login/register) */
.auth-form{display:flex; flex-direction:column; gap:12px;}
.auth-field{display:flex; flex-direction:column; gap:5px;}
.auth-field label{font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
.auth-field input{
  background:var(--bg-2); border:1px solid var(--line-soft); border-radius:10px; color:var(--text);
  padding:10px 14px; font-family:inherit; font-size:14px; outline:none; width:100%; box-sizing:border-box;
}
.auth-field input:focus{border-color:var(--violet);}
.auth-row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.auth-submit{
  margin-top:2px; padding:11px; border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:14px;
}
.auth-google-btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:11px; border-radius:999px; border:1px solid var(--line-soft); background:var(--bg-2);

.auth-switch button:hover{text-decoration:underline;}
.auth-error{color:#ff8a8a; font-size:12.5px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); padding:9px 12px; border-radius:9px; margin-bottom:2px;}
.auth-hint{font-size:11px; color:var(--text-faint); margin-top:-4px;}
.avatar-photo{width:100%; height:100%; border-radius:50%; object-fit:cover;}
.modal-head-row{position:absolute; top:16px; right:16px; display:flex; gap:8px; z-index:2;}
.modal-icon-btn{
  width:32px; height:32px; border-radius:50%; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim); cursor:pointer;
  transition:background .12s, color .12s, border-color .12s;
}
.modal-icon-btn svg{width:15px; height:15px;}
.modal-icon-btn:hover{color:#fff; border-color:var(--violet);}
.modal-icon-btn.copied{background:rgba(34,197,94,.2); border-color:#22c55e; color:#8ff0b0;}
.profile-card-modal{margin-top:6px;}

/* gallery popup */
.gallery-scroll{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 6px; scroll-snap-type:x proximity;}
.gallery-photo{
  position:relative; flex:0 0 auto; width:220px; aspect-ratio:16/10; border-radius:var(--radius-m);
  overflow:hidden; scroll-snap-align:start; box-shadow:0 12px 26px -12px rgba(0,0,0,.55);
}
.gallery-photo-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:32px; color:rgba(255,255,255,.25);
}
@media(max-width:480px){.gallery-photo{width:160px;}}

/* favorites popup */
.fav-list{display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto;}
.fav-row{
  display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:10px; text-decoration:none; color:var(--text);
  transition:background .12s;
}
.fav-row:hover{background:var(--bg-2);}
.fav-rank{flex:0 0 auto; width:20px; text-align:center; font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--text-faint);}
.fav-avatar{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:14px; color:#fff;
}
.fav-name{flex:1; min-width:0; font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fav-mini{flex:0 0 auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-faint); font-weight:600;}
.fav-mini svg{width:13px; height:13px; margin-right:3px; vertical-align:-2px;}

/* user profile page */
.profile-card{
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-l);
  padding:30px 26px 24px; display:flex; flex-direction:column; align-items:center; gap:6px;
  max-width:480px; margin:0 auto 30px;
}
.profile-top-combo{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px;}

  .profile-top-combo{gap:8px;}

  .profile-top-combo .profile-avg-box{width:60px; height:60px; border-radius:14px;}

.profile-avatar-btn{

.fav-users-btn{

function wordsRemainingLabel(remaining){
  if(remaining===1) return `Ještě 1 slovo`;
  if(remaining>=2 && remaining<=4) return `Ještě ${remaining} slova`;
  return `Ještě ${remaining} slov`;
}
function wordsOverLabel(over){
  if(over===1) return `O 1 slovo překračuje limit (max. ${REVIEW_MAX_WORDS})`;
  if(over>=2 && over<=4) return `O ${over} slova překračuje limit (max. ${REVIEW_MAX_WORDS})`;
  return `O ${over} slov překračuje limit (max. ${REVIEW_MAX_WORDS})`;

  const wc=wordCount(textarea.value);
  if(wc < REVIEW_MIN_WORDS){

    btn.textContent = wc===0 ? `Napište recenzi (min. ${REVIEW_MIN_WORDS} slov)` : wordsRemainingLabel(REVIEW_MIN_WORDS-wc);
  }else if(wc > REVIEW_MAX_WORDS){

function seedReviews(id, base){
  const arr=[]; const n=2+(hashStr(id)%3);
  for(let i=0;i<n;i++){
    const off=((hashStr(id+i)%21)-10);
    let sc=Math.max(0,Math.min(100, base+off));
    sc=Math.round(sc/5)*5;
    arr.push({
      id: id+'-seed-'+i,
      author:REVIEW_AUTHORS[(hashStr(id)+i)%REVIEW_AUTHORS.length], score:sc, text:REVIEW_SNIPPETS[(hashStr(id)+i*3)%REVIEW_SNIPPETS.length],
      baseLikes: hashStr(id+'like'+i)%38,
      baseDislikes: hashStr(id+'dis'+i)%9,
      baseFunny: hashStr(id+'fun'+i)%22
    });
  }
  return arr;
}

/* Build DB items from plain records: {title,year,date,score,box?,country?,genre?,director?,composer?,writer?,actors?,developer?}
   Used both for the built-in sample data and for an external, real data.json (see loadRealData below).
   actors/crew are normalized to {name,...} objects regardless of source, so rendering code
   never has to check whether it's dealing with the demo dataset or real fetched data. */
function normalizeActors(list){
  return (list||[]).map(a=>{
    if(typeof a==='string') return {name:a, birthday:null, deathday:null, age:null, image:''};
    return {name:a.name||'', birthday:a.birthday||null, deathday:a.deathday||null, age:(a.age!==undefined?a.age:null), image:a.image||''};
  });
}
function normalizeCrew(person){
  if(!person) return {name:'', image:''};
  if(typeof person==='string') return {name:person, image:''};
  return {name:person.name||'', image:person.image||''};
}
function stableId(prefix, r, index){
  // Position-based ids (prefix+index) silently break the moment a re-fetch changes
  // array order — a review posted against "position 37" stays pointed at position 37
  // forever, even after a different title ends up there. TMDb's and RAWG's own ids are
  // permanent and never change for a given title, so those are used whenever available.
  // Wikidata-sourced Czech/Slovak content has no tmdb_id, only imdb_id — also permanent,
  // so that's the fallback. Only truly id-less records fall back to position (rare, and
  // no worse than the old behavior for those specific records).
  if(r.tmdb_id) return prefix+'t'+r.tmdb_id;
  if(r.rawg_id) return prefix+'r'+r.rawg_id;
  if(r.imdb_id) return prefix+'i'+r.imdb_id;
  return prefix+index;
}
function buildFromRecords(records, type, prefix){
  return records.map((r,i)=>{
    const id=stableId(prefix, r, i);
    const item={
      id, type, title:r.title, year:r.year, date:r.date, baseScore:r.score,
      yearOnly: !!r.year_only,
      genre: r.genre || (type==='game' ? GENRES_GAME[i%GENRES_GAME.length] : GENRES_MG[i%GENRES_MG.length]),
      country: r.country || '',
      poster: r.poster || '', gallery: r.gallery || [], summary: r.summary || '',
      seed: (r.reviews && r.reviews.length) ? r.reviews.map((rv,ri)=>({id:id+'-seed-'+ri, author:rv.author||REVIEW_AUTHORS[i%REVIEW_AUTHORS.length], score:rv.score, text:rv.text, baseLikes:rv.likes||0, baseDislikes:rv.dislikes||0, baseFunny:rv.funny||0})) : []
    };
    if(type==='movie'){ item.box=(r.box===undefined?null:r.box); item.boxCurrency=r.box_currency||'USD'; item.runtime=(r.runtime===undefined?null:r.runtime); item.director=normalizeCrew(r.director); item.composer=normalizeCrew(r.composer); item.writer=normalizeCrew(r.writer); item.actors=normalizeActors(r.actors); }
    if(type==='show'){ item.runtimeMin=(r.runtime_min===undefined?null:r.runtime_min); item.runtimeMax=(r.runtime_max===undefined?null:r.runtime_max); item.director=normalizeCrew(r.director); item.composer=normalizeCrew(r.composer); item.writer=normalizeCrew(r.writer); item.actors=normalizeActors(r.actors); }
    if(type==='game'){ item.developer=r.developer; item.platforms=r.platforms||[]; item.yearOnly=!!r.year_only; }
    return item;
  });
}

// USER_REVIEWS is now purely an in-memory cache, populated per-item from Firestore via
// loadReviewsForItem() and per-author via getUserReviewsAsync() — never persisted locally.
let USER_REVIEWS={};
function reviewDocToLocal(doc){
  const d=doc.data();
  const toIso=(ts)=> (ts && typeof ts.toDate==='function') ? ts.toDate().toISOString() : (ts||null);
  return {
    rid:doc.id, author:d.author, score:d.score, text:d.text, createdAt:toIso(d.createdAt), editedAt:toIso(d.editedAt),
    baseLikes:d.likesCount||0, baseDislikes:d.dislikesCount||0, baseFunny:d.funnyCount||0,
  };
}
async function loadReviewsForItem(item){
  try{
    const snap=await db.collection('reviews').where('itemId','==',item.id).get();
    USER_REVIEWS[item.id]=snap.docs.map(reviewDocToLocal);
    await loadMyVotesForReviews(USER_REVIEWS[item.id].map(r=>r.rid));
  }catch(e){
    console.error('Nepodařilo se načíst recenze pro', item.id, e);
    USER_REVIEWS[item.id]=USER_REVIEWS[item.id]||[];
  }
}
async function getUserReviewsAsync(username){
  const out=[];
  try{
    const snap=await db.collection('reviews').where('author','==',username).get();
    snap.docs.forEach(doc=>{
      const d=doc.data();
      const item=findItem(d.itemType, d.itemId);
      if(!item) return;
      const review=Object.assign(reviewDocToLocal(doc), {baseLikes:0, baseDislikes:0, baseFunny:0, isUser:true});
      out.push({review, item, type:d.itemType});
    });
  }catch(e){
    console.error('Nepodařilo se načíst recenze uživatele', username, e);
  }
  return out.reverse();
}

// Global vote counts now live directly on each review document (likesCount/dislikesCount/
// funnyCount), kept accurate via a transaction every time someone votes — see toggleVote().
// MY_VOTES is a separate, much smaller cache: just the CURRENT USER's own vote state per
// review, fetched alongside whichever reviews are currently on screen (loadReviewsForItem),
// so the vote buttons can show as already-active correctly.
let MY_VOTES={};
function voteCounts(review){
  return {likes:review.baseLikes||0, dislikes:review.baseDislikes||0, funny:review.baseFunny||0};
}
async function loadMyVotesForReviews(reviewIds){
  if(!CURRENT_UID || !reviewIds.length) return;
  for(let i=0;i<reviewIds.length;i+=30){ // Firestore 'in' queries cap at 30 values
    const chunk=reviewIds.slice(i,i+30);
    try{
      const snap=await db.collection('votes').where('uid','==',CURRENT_UID).where('reviewId','in',chunk).get();
      snap.docs.forEach(doc=>{ const d=doc.data(); MY_VOTES[d.reviewId]=d; });
    }catch(e){
      console.error('Nepodařilo se načíst moje hlasy', e);
    }
  }
}
async function toggleVote(reviewId, kind){
  if(!CURRENT_UID){ openAuthModal('login'); return; }
  const voteRef=db.collection('votes').doc(reviewId+'_'+CURRENT_UID);
  const reviewRef=db.collection('reviews').doc(reviewId);
  const progressRef=db.collection('progress').doc(CURRENT_UID);
  try{
    await db.runTransaction(async (tx)=>{
      const [voteSnap, reviewSnap]=await Promise.all([tx.get(voteRef), tx.get(reviewRef)]);
      if(!reviewSnap.exists) return; // demo/seed review with no real Firestore doc — nothing to persist
      const old=voteSnap.exists ? voteSnap.data() : {liked:false, disliked:false, funny:false};
      const next={liked:old.liked, disliked:old.disliked, funny:old.funny};
      if(kind==='like'){ next.liked=!next.liked; if(next.liked) next.disliked=false; }
      else if(kind==='dislike'){ next.disliked=!next.disliked; if(next.disliked) next.liked=false; }
      else if(kind==='funny'){ next.funny=!next.funny; }
      tx.set(voteRef, {reviewId, uid:CURRENT_UID, liked:next.liked, disliked:next.disliked, funny:next.funny, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      tx.update(reviewRef, {
        likesCount: firebase.firestore.FieldValue.increment((next.liked?1:0)-(old.liked?1:0)),
        dislikesCount: firebase.firestore.FieldValue.increment((next.disliked?1:0)-(old.disliked?1:0)),
        funnyCount: firebase.firestore.FieldValue.increment((next.funny?1:0)-(old.funny?1:0)),
      });
      // Lifetime counters for achievements — only ever increment (a like given then later
      // un-liked still "counts" toward having given it once), never decrement.
      const lifetimeInc={};
      if(next.liked && !old.liked) lifetimeInc.totalLikesGiven=firebase.firestore.FieldValue.increment(1);
      if(next.funny && !old.funny) lifetimeInc.totalFunnyGiven=firebase.firestore.FieldValue.increment(1);
      if(Object.keys(lifetimeInc).length){
        tx.set(progressRef, Object.assign({uid:CURRENT_UID, username:CURRENT_USER}, lifetimeInc), {merge:true});
      }
    });
  }catch(e){
    console.error('Nepodařilo se zaznamenat hlas', e);
  }
}

async function buildAchievementContext(username){
  const [entries, top10Movie, top10Show, top10Game, progress] = await Promise.all([
    getUserReviewsAsync(username),
    getTop10For(username,'movie'),
    getTop10For(username,'show'),
    getTop10For(username,'game'),
    getProgress(CURRENT_UID),
  ]);
  return {entries, top10Movie, top10Show, top10Game, progress};
}
async function refreshMyAchievements(){
  // Live-checks every achievement against fresh data and persists any newly-earned ones.
  // Achievements are permanent once unlocked, even if the underlying condition later
  // stops being true (e.g. a review gets deleted after "Jubileum" was earned at 100).
  if(!CURRENT_UID) return {unlocked:{}, newly:[]};
  const ctx=await buildAchievementContext(CURRENT_USER);
  const already=ctx.progress.unlockedAchievements||{};
  const unlocked=Object.assign({}, already);
  const newly=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!unlocked[a.id] && a.check(ctx)){ unlocked[a.id]=true; newly.push(a.id); }
  });
  if(newly.length){
    try{
      await db.collection('progress').doc(CURRENT_UID).set({uid:CURRENT_UID, username:CURRENT_USER, unlockedAchievements:unlocked}, {merge:true});
    }catch(e){
      console.error('Nepodařilo se uložit nově získané úspěchy', e);
    }
  }
  return {unlocked, newly};
}

/* ===== GAMIFICATION: weekly quests ===== */
// All date logic here resolves against Europe/Prague wall-clock time (CET/CEST), so the
// weekly reset always lands on Monday 00:00 local Czech time regardless of the viewer's
// own browser timezone or of DST transitions.
function getPragueDateComponents(date){
  const parts=new Intl.DateTimeFormat('en-US', {
    timeZone:'Europe/Prague', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hour12:false,
  }).formatToParts(date);
  const map={}; parts.forEach(p=>map[p.type]=p.value);
  return {year:+map.year, month:+map.month, day:+map.day, hour:(+map.hour)%24};
}
function getThisWeekMondayComponents(now){
  now=now||new Date();
  const c=getPragueDateComponents(now);
  // Treat the Prague calendar date as if it were UTC purely for safe date arithmetic
  // (day-of-week, subtracting days) — never used to represent a real instant.
  const fakeUtc=new Date(Date.UTC(c.year, c.month-1, c.day));
  const dow=fakeUtc.getUTCDay(); // 0=Sun..6=Sat
  const daysSinceMonday=(dow+6)%7; // Mon=0,...,Sun=6
  fakeUtc.setUTCDate(fakeUtc.getUTCDate()-daysSinceMonday);
  return {year:fakeUtc.getUTCFullYear(), month:fakeUtc.getUTCMonth()+1, day:fakeUtc.getUTCDate()};
}
function getWeekId(now){
  const m=getThisWeekMondayComponents(now);
  return `${m.year}-${String(m.month).padStart(2,'0')}-${String(m.day).padStart(2,'0')}`;
}
function pragueMidnightUtcInstant(year, month, day){
  // Finds the real UTC instant corresponding to 00:00:00 on the given date in Prague time,
  // correctly handling both CET (UTC+1) and CEST (UTC+2) by checking what hour midnight-UTC
  // actually reads as in Prague, then subtracting that offset.
  const guessUtc=new Date(Date.UTC(year, month-1, day, 0,0,0));
  const hourInPrague=parseInt(new Intl.DateTimeFormat('en-US', {timeZone:'Europe/Prague', hour:'2-digit', hour12:false}).format(guessUtc), 10)%24;
  return new Date(guessUtc.getTime()-hourInPrague*3600*1000);
}
function getWeekStartInstant(now){
  const m=getThisWeekMondayComponents(now);
  return pragueMidnightUtcInstant(m.year, m.month, m.day);
}

function pickRandomQuests(){
  const pool=QUEST_POOL.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,5).map(t=>{
    const target=t.min+Math.floor(Math.random()*(t.max-t.min+1));
    return {templateId:t.id, target, label:t.label(target)};
  });
}
async function getThisWeeksQuests(){
  const weekId=getWeekId();
  const ref=db.collection('weeklyQuests').doc(weekId);
  try{
    const doc=await ref.get();
    if(doc.exists) return doc.data().quests;
  }catch(e){
    console.error('Nepodařilo se načíst týdenní questy', e);
    return [];
  }
  // Not generated yet this week — this is the first client to notice, so it generates and
  // saves the set. Security rules only allow CREATE (not overwrite), so a race between two
  // users doing this simultaneously can't corrupt an already-generated week.
  const quests=pickRandomQuests();
  try{
    await ref.set({weekId, quests, generatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){
    // Someone else generated it a moment ago — just read back what they saved.
    try{ const doc2=await ref.get(); if(doc2.exists) return doc2.data().quests; }catch(e2){}
  }
  return quests;
}
async function countMyVotesThisWeek(kind, weekStart){

async function buildWeeklyQuestContext(weekStart){

    getUserReviewsAsync(CURRENT_USER),

  ]);
  const weekEntries=allEntries.filter(e=> e.review.createdAt && new Date(e.review.createdAt)>=weekStart);
  return {weekEntries, likesThisWeek, funnyThisWeek, favoritesThisWeek};

async function refreshMyQuests(){
  if(!CURRENT_UID) return {quests:[]};
  const weekId=getWeekId();
  const weekStart=getWeekStartInstant();
  const [quests, prog, ctx]=await Promise.all([
    getThisWeeksQuests(),
    getMyProgress(),
    buildWeeklyQuestContext(weekStart),
  ]);
  const completedSoFar=(prog.questWeekId===weekId) ? (prog.completedQuests||{}) : {};
  const updatedCompleted=Object.assign({}, completedSoFar);
  const newlyCompleted=[];
  const results=quests.map(q=>{
    const template=QUEST_POOL_BY_ID[q.templateId];
    const current=template ? Math.min(template.progress(ctx), q.target) : 0;
    const done=!!completedSoFar[q.templateId] || current>=q.target;
    if(done && !completedSoFar[q.templateId]){ updatedCompleted[q.templateId]=true; newlyCompleted.push(q.templateId); }
    return Object.assign({}, q, {current, done});
  });
  if(newlyCompleted.length || prog.questWeekId!==weekId){
    try{
      await db.collection('progress').doc(CURRENT_UID).set({
        uid:CURRENT_UID, username:CURRENT_USER,
        questWeekId:weekId, completedQuests:updatedCompleted,
        xp:firebase.firestore.FieldValue.increment(newlyCompleted.length*XP_PER_QUEST),
      }, {merge:true});
    }catch(e){
      console.error('Nepodařilo se uložit postup questů', e);
    }
  }
  return {quests:results, newlyCompleted};
}

function userAggregate(entries){
  let likes=0,dislikes=0,funny=0,scoreSum=0;
  entries.forEach(({review})=>{
    const c=voteCounts(review);
    likes+=c.likes; dislikes+=c.dislikes; funny+=c.funny; scoreSum+=review.score;
  });
  const avg=entries.length ? Math.round(scoreSum/entries.length) : 0;
  return {entries, likes, dislikes, funny, avg};
}

function myIdentity(){ return CURRENT_USER || 'Vy'; }
function allReviews(item){
  // rid is a stable id generated at submit time (immune to array-index shifting when a
  // review elsewhere gets deleted); older reviews saved before this existed fall back to
  // the old index-based id so their vote counts aren't reset by this change.
  const own=(USER_REVIEWS[item.id]||[]).map((r,i)=>Object.assign({id:r.rid || (item.id+'-user-'+i), baseLikes:0, baseDislikes:0, baseFunny:0, isUser:true}, r));
  return item.seed.concat(own);
}
function myReviewForItem(item){
  const list=USER_REVIEWS[item.id]||[];
  const idx=list.findIndex(r=>r.author===myIdentity());
  return idx===-1 ? null : {index:idx, review:list[idx]};
}
async function updateMyReview(item, newScore, newText){
  const list=USER_REVIEWS[item.id]||[];
  const idx=list.findIndex(r=>r.author===myIdentity());
  if(idx===-1) return;
  const rid=list[idx].rid;
  await clearVotesForReview(rid);
  await db.collection('reviews').doc(rid).update({
    score:newScore, text:newText, editedAt:firebase.firestore.FieldValue.serverTimestamp(),
    likesCount:0, dislikesCount:0, funnyCount:0,
  });
  delete MY_VOTES[rid];
  await loadReviewsForItem(item);
}
async function deleteMyReview(item){
  const list=USER_REVIEWS[item.id]||[];
  const idx=list.findIndex(r=>r.author===myIdentity());
  if(idx===-1) return;
  const rid=list[idx].rid;
  await clearVotesForReview(rid);
  await db.collection('reviews').doc(rid).delete();
  delete MY_VOTES[rid];
  await loadReviewsForItem(item);
}
function liveScore(item){
  const revs=allReviews(item);
  const all=[];
  if(item.baseScore!==null && item.baseScore!==undefined) all.push(item.baseScore);
  revs.forEach(r=>all.push(r.score));
  if(all.length===0) return null;
  const avg=all.reduce((a,b)=>a+b,0)/all.length;
  return Math.round(avg);
}
/* For sort comparators: unscored ("N") items sort to the bottom rather than breaking
   the comparison (null - number is NaN in JS, which sorts unpredictably). */
function scoreSortValue(item){
  const s=liveScore(item);
  return s===null ? -1 : s;
}

/* daily drop simulation: unshift one queued title per category once per ET calendar day after 20:00 */
function etNowParts(){
  const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false});
  const parts={}; fmt.formatToParts(new Date()).forEach(p=>parts[p.type]=p.value);
  return {dateKey:`${parts.year}-${parts.month}-${parts.day}`, hour:parseInt(parts.hour)};
}
function runDailyDrop(){
  const {dateKey,hour}=etNowParts();
  const last=localStorage.getItem('kritiq_lastDrop');
  if(hour<20 || last===dateKey) return;
  const added=loadAddedItems();
  ['movie','show','game'].forEach(type=>{
    const q=QUEUE[type];
    if(!q.length) return;
    const picked=q.shift();
    let item;
    const id=type[0]+'new'+dateKey+Math.floor(Math.random()*999);
    if(type==='movie'){
      const [title,box,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,box,baseScore:score,
        director:normalizeCrew(DIRECTORS[hashStr(title)%DIRECTORS.length]),composer:normalizeCrew(COMPOSERS[hashStr(title)%COMPOSERS.length]),
        writer:normalizeCrew(WRITERS[hashStr(title)%WRITERS.length]),
        actors:normalizeActors([ACTORS[hashStr(title)%ACTORS.length],ACTORS[(hashStr(title)+3)%ACTORS.length],ACTORS[(hashStr(title)+5)%ACTORS.length],ACTORS[(hashStr(title)+7)%ACTORS.length]]),
        seed:seedReviews(id,score), isNew:true};
    }else if(type==='show'){
      const [title,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,baseScore:score,
        director:normalizeCrew(DIRECTORS[hashStr(title)%DIRECTORS.length]),composer:normalizeCrew(COMPOSERS[hashStr(title)%COMPOSERS.length]),
        writer:normalizeCrew(WRITERS[hashStr(title)%WRITERS.length]),
        actors:normalizeActors([ACTORS[hashStr(title)%ACTORS.length],ACTORS[(hashStr(title)+3)%ACTORS.length],ACTORS[(hashStr(title)+5)%ACTORS.length],ACTORS[(hashStr(title)+7)%ACTORS.length]]),
        seed:seedReviews(id,score), isNew:true};
    }else{
      const [title,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,baseScore:score,
        developer:DEVS[hashStr(title)%DEVS.length], seed:seedReviews(id,score), isNew:true};
    }
    DB[type].unshift(item);
    added[type].push(item);
  });
  localStorage.setItem('kritiq_lastDrop', dateKey);
  saveAddedItems(added);
}
function restoreAddedItems(){
  const added=loadAddedItems();
  ['movie','show','game'].forEach(type=>{
    added[type].forEach(it=>{ it.isNew=true; DB[type].unshift(it); });
  });
}

function sortedReviews(item){
  const mine=myIdentity();
  return allReviews(item).slice().sort((a,b)=>{
    const aMine=(a.isUser && a.author===mine) ? 1 : 0;
    const bMine=(b.isUser && b.author===mine) ? 1 : 0;
    if(aMine!==bMine) return bMine-aMine;
    const ca=voteCounts(a), cb=voteCounts(b);
    return (cb.likes+cb.funny)-(ca.likes+ca.funny);
  });
}

async function mostRecentFeaturedAsync(){
  try{
    const snap=await db.collection('reviews').orderBy('createdAt','desc').limit(1).get();
    if(snap.empty) return null;
    const doc=snap.docs[0];
    const d=doc.data();
    const item=findItem(d.itemType, d.itemId);
    if(!item) return null;
    const review=Object.assign(reviewDocToLocal(doc), {id:doc.id, baseLikes:0, baseDislikes:0, baseFunny:0, isUser:true});
    return {label:'Nejnovější recenze', review, item, type:d.itemType};
  }catch(e){
    console.error('Nepodařilo se načíst nejnovější recenzi', e);
    return null;
  }
}
function mostFunnyFeatured(days){
  const cutoff=Date.now() - days*24*60*60*1000;
  const all=allTimestampedReviews().filter(e=> new Date(e.review.createdAt).getTime() >= cutoff);
  if(!all.length) return null;
  all.sort((a,b)=> voteCounts(b.review).funny - voteCounts(a.review).funny);
  if(voteCounts(all[0].review).funny <= 0) return null;
  return Object.assign({label:`Nejvtipnější recenze (${days} dní)`}, all[0]);
}
function mostLikedFeatured(days){
  const cutoff=Date.now() - days*24*60*60*1000;
  const all=allTimestampedReviews().filter(e=> new Date(e.review.createdAt).getTime() >= cutoff);
  if(!all.length) return null;
  all.sort((a,b)=> voteCounts(b.review).likes - voteCounts(a.review).likes);
  if(voteCounts(all[0].review).likes <= 0) return null;
  return Object.assign({label:`Nejoblíbenější recenze (${days} dní)`}, all[0]);
}

let bannerSwipedRecently=false;
function bindBannerSlideClick(){
  const slide=document.querySelector('.comment-banner-slide');
  if(!slide) return;
  slide.addEventListener('click', ()=>{
    if(bannerSwipedRecently) return; // swipe just fired a navigation — don't also treat it as a tap-to-open
    PENDING_REVIEW_TO_OPEN=slide.dataset.reviewId;
    stopBannerAutoAdvance();
    location.hash=`#/title/${slide.dataset.type}/${slide.dataset.itemId}`;
  });
}
function bindBannerSwipe(){
  const wrap=document.getElementById('commentBannerWrap');
  if(!wrap) return;
  let startX=0, startY=0, dragging=false;
  wrap.addEventListener('touchstart', (e)=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    dragging=true;
  }, {passive:true});
  wrap.addEventListener('touchend', (e)=>{
    if(!dragging) return;
    dragging=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
      bannerSwipedRecently=true;
      setTimeout(()=>{ bannerSwipedRecently=false; }, 300);
      goToBannerSlide(dx<0 ? bannerIndex+1 : bannerIndex-1);
      startBannerAutoAdvance();
    }
  }, {passive:true});
}
function startBannerAutoAdvance(){
  stopBannerAutoAdvance();
  if(bannerSlides.length<2) return;
  bannerTimer=setInterval(()=> goToBannerSlide(bannerIndex+1), 10000);
}
function stopBannerAutoAdvance(){
  if(bannerTimer){ clearInterval(bannerTimer); bannerTimer=null; }
}
function attachCommentBannerEvents(){
  if(!bannerSlides.length) return;

function distinctGenres(type){
  const set=new Set();
  DB[type].forEach(it=>{
    (it.genre||'').split(',').forEach(g=>{
      const trimmed=g.trim();
      if(trimmed) set.add(trimmed);
    });
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'cs'));
}

function sortedListFor(type){
  const st=listState[type+'s'];
  let items=DB[type].filter(it=>it.year>=st.y0 && it.year<=st.y1);
  if(type==='game' && st.platform && st.platform!=='ALL'){
    items=items.filter(it=>it.platforms && it.platforms.includes(st.platform));
  }
  if((type==='movie' || type==='show') && st.filter && st.filter!=='ALL'){
    if(st.filter==='CZECH'){
      items=items.filter(it=>it.country==='Česko');
    }else if(st.filter==='NO_DOC'){
      items=items.filter(it=>!(it.genre||'').split(',').map(g=>g.trim()).includes('Dokumentární'));
    }else{
      items=items.filter(it=>(it.genre||'').split(',').map(g=>g.trim()).includes(st.filter));
    }
  }
  return items.slice().sort((a,b)=>{
    if(st.sort==='score') return scoreSortValue(b)-scoreSortValue(a);
    if(st.sort==='new') return b.date.localeCompare(a.date);
    if(st.sort==='box' && type==='movie') return (b.box===null||b.box===undefined?-1:b.box) - (a.box===null||a.box===undefined?-1:a.box);
    return a.title.localeCompare(b.title);
  });
}
function listBodyHTML(type){
  const st=listState[type+'s'];
  const sorted=sortedListFor(type);
  const shown=sorted.slice(0, st.page*PAGE_SIZE);
  const grid=shown.length? `<div class="grid">${shown.map(it=>cardHTML(it)).join('')}</div>` : `<p class="empty-note">V tomto rozmezí let nic nemáme. Zkuste posunout filtr.</p>`;
  const remaining=sorted.length-shown.length;
  const more=remaining>0 ? `<div class="load-more-wrap"><button class="load-more-btn" id="loadMoreBtn">Načíst dalších ${Math.min(PAGE_SIZE,remaining)} (zbývá ${remaining})</button></div>` : '';
  return {html:grid+more, shown:shown.length, total:sorted.length};
}

function attachListEvents(type){
  const key=type+'s'; const st=listState[key];
  const y0=document.getElementById('y0'), y1=document.getElementById('y1');
  const sortSel=document.getElementById('sortSel');
  function updateFill(){
    const min=parseInt(y0.min), max=parseInt(y0.max);
    const lo=Math.min(+y0.value,+y1.value), hi=Math.max(+y0.value,+y1.value);
    const pct0=(lo-min)/(max-min)*100, pct1=(hi-min)/(max-min)*100;
    document.getElementById('rangeFill').style.left=pct0+'%';
    document.getElementById('rangeFill').style.width=(pct1-pct0)+'%';
    document.getElementById('yearReadout').textContent=lo+' – '+hi;
  }
  updateFill();
  bindLoadMore(type);
  if(type==='game') bindPlatformFilter();
  if(type==='movie' || type==='show') bindGenreFilter(type);
  [y0,y1].forEach(inp=>inp.addEventListener('input',()=>{
    st.y0=Math.min(+y0.value,+y1.value); st.y1=Math.max(+y0.value,+y1.value);
    st.page=1;
    updateFill();
    refreshListBody(type);
  }));
  sortSel.addEventListener('change',()=>{ st.sort=sortSel.value; st.page=1; refreshListBody(type); });

function collectFilmography(name){
  const cats={
    director:{movie:[], show:[]}, writer:{movie:[], show:[]},
    composer:{movie:[], show:[]}, actor:{movie:[], show:[]},
    developer:[],
  };
  ['movie','show'].forEach(type=>{
    DB[type].forEach(it=>{
      if(it.director.name===name) cats.director[type].push(it);
      if(it.composer.name===name) cats.composer[type].push(it);
      if(it.writer.name===name) cats.writer[type].push(it);
      if(it.actors && it.actors.some(a=>a.name===name)) cats.actor[type].push(it);
    });
  });
  DB.game.forEach(it=>{ if(it.developer===name) cats.developer.push(it); });
  ['director','writer','composer','actor'].forEach(k=>{
    cats[k].movie.sort((a,b)=>b.date.localeCompare(a.date));
    cats[k].show.sort((a,b)=>b.date.localeCompare(a.date));
  });
  cats.developer.sort((a,b)=>b.date.localeCompare(a.date));
  return cats;
}
/* Finds birthday/deathday/age/photo for a person by scanning credits across movies and
   shows — Kritiq's person pages are keyed by name (not a stored id), so this grabs the
   first match found. Actors carry birthday/deathday/age; director/composer/writer only
   carry a photo (that's all that was asked for crew), so both are checked. */
function findPersonInfo(name){
  let photoOnly=null;
  for(const type of ['movie','show']){
    for(const it of DB[type]){
      if(it.actors){
        const match=it.actors.find(a=>a.name===name);
        if(match && (match.birthday || match.deathday || match.image)) return match;
      }
      for(const role of [it.director, it.composer, it.writer]){
        if(role && role.name===name && role.image && !photoOnly){
          photoOnly={name, birthday:null, deathday:null, age:null, image:role.image};
        }
      }
    }
  }
  return photoOnly;
}
function fmtBioDate(d){
  if(!d) return '';
  const [y,m,day]=d.split('-');
  const months=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
  return `${parseInt(day)}. ${months[parseInt(m)-1]} ${y}`;
}

function normalizeSearchText(s){
  // Strips diacritics (Hvězdné války -> hvezdne valky) so search works regardless of
  // whether the visitor types accents or not.
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
let PEOPLE_INDEX=null;
function buildPeopleIndex(){
  const map=new Map();
  function addPerson(name, image){
    if(!name) return;
    if(!map.has(name)) map.set(name, {name, image:image||null});
    else if(image && !map.get(name).image) map.get(name).image=image;
  }
  ['movie','show'].forEach(type=>{
    DB[type].forEach(it=>{
      if(it.director && it.director.name) addPerson(it.director.name, it.director.image);
      if(it.writer && it.writer.name) addPerson(it.writer.name, it.writer.image);
      if(it.composer && it.composer.name) addPerson(it.composer.name, it.composer.image);
      (it.actors||[]).forEach(a=>addPerson(a.name, a.image));
    });
  });
  DB.game.forEach(it=>{ if(it.developer) addPerson(it.developer, null); });
  PEOPLE_INDEX=[...map.values()];
  return PEOPLE_INDEX;
}
function getPeopleIndex(){
  return PEOPLE_INDEX || buildPeopleIndex();
}
function searchTitles(query){
  const nq=normalizeSearchText(query);
  if(!nq) return [];
  return [...DB.movie,...DB.show,...DB.game].filter(it=>normalizeSearchText(it.title).includes(nq));
}
function searchPeople(query){
  const nq=normalizeSearchText(query);
  if(!nq) return [];
  return getPeopleIndex().filter(p=>normalizeSearchText(p.name).includes(nq));
}

function renderSearch(q){
  const titleResults=searchTitles(q);
  const peopleResults=searchPeople(q);
  const total=titleResults.length+peopleResults.length;
  return `
    <h1 class="page-title">Výsledky hledání</h1>
    <p class="page-sub">"${esc(q)}" — nalezeno ${total}</p>
    ${peopleResults.length ? `

        return `<a class="person-search-item" href="#/person/${encodeURIComponent(p.name)}">
          <span class="person-search-avatar" style="${style}">${inner}</span>
          <span class="person-search-name">${esc(p.name)}</span>

    ${titleResults.length ? `<h3 class="section-title" style="${peopleResults.length?'margin-top:22px;':''}">Filmy, seriály a hry (${titleResults.length})</h3><div class="grid">${titleResults.map(it=>cardHTML(it)).join('')}</div>` : ''}
    ${!total ? `<p class="empty-note">Nic jsme nenašli. Zkuste jiný výraz.</p>` : ''}
  `;
}
