function setActiveNav(route){
  document.querySelectorAll('#mainNav a').forEach(a=>{
    a.classList.toggle('active', route.startsWith(a.dataset.r));
  });
}
let SCROLL_POSITIONS={};
let lastRouteHash=null;

async function route(){
  if(lastRouteHash!==null){
    SCROLL_POSITIONS[lastRouteHash]=window.scrollY;
  }
  const hash=location.hash || '#/';
  const parts=hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const app=document.getElementById('app');
  setActiveNav(parts[0]||'');

  const isHomepage=parts.length===0;
  const isListPage=['movies','shows','games'].includes(parts[0]);
  if(isListPage && !RECENT_CATALOG_READY){
    app.innerHTML=skeletonListHTML();
    await RECENT_CATALOG_PROMISE;
  }else if(!isHomepage && !isListPage && !FULL_CATALOG_READY){
    app.innerHTML=SKELETON_HOME_HTML;
    await FULL_CATALOG_PROMISE;
  }

  if(parts.length===0){
    app.innerHTML=renderHome(); attachHotRowEvents();
    loadAndRenderCommentBanner(); // fire-and-forget — trending rows shouldn't wait on this
  }else if(parts[0]==='movies'){
    app.innerHTML=renderList('movie'); attachListEvents('movie');
  }else if(parts[0]==='shows'){
    app.innerHTML=renderList('show'); attachListEvents('show');
  }else if(parts[0]==='games'){
    app.innerHTML=renderList('game'); attachListEvents('game');
  }else if(parts[0]==='title' && parts[1] && parts[2]){
    const item=findItem(parts[1], parts[2]);
    if(item) await loadReviewsForItem(item);
    app.innerHTML=renderDetail(parts[1],parts[2]); attachDetailEvents(parts[1],parts[2]);
    if(PENDING_REVIEW_TO_OPEN){
      const rid=PENDING_REVIEW_TO_OPEN;
      PENDING_REVIEW_TO_OPEN=null;
      openReviewModalById(parts[2], rid);
    }
  }else if(parts[0]==='person' && parts[1]){
    app.innerHTML=renderPerson(decodeURIComponent(parts[1]));
  }else if(parts[0]==='user' && parts[1]){
    app.innerHTML=await renderUserProfile(decodeURIComponent(parts[1])); attachUserProfileEvents(decodeURIComponent(parts[1]));
  }else if(parts[0]==='search' && parts[1]){
    app.innerHTML=renderSearch(decodeURIComponent(parts[1]));
  }else{
    app.innerHTML=renderHome(); attachHotRowEvents();
    loadAndRenderCommentBanner();
  }

  const saved=SCROLL_POSITIONS[hash];
  window.scrollTo({top: saved!==undefined ? saved : 0, behavior:'instant'in window?'instant':'auto'});
  lastRouteHash=hash;
}

/* ======================= INIT ======================= */
/* If a real, generated dataset (data.json) sits next to this file, it is used automatically.
   See fetch_data.py / fetch_data_daily.py for how to generate a real, thousands-title
   data.json from TMDb (movies/shows) and RAWG (games) — drop the file next to kritiq.html
   and reload. poster/gallery only render when this page is opened outside the Claude-hosted
   preview link (locally or self-hosted), since that sandbox blocks external images.
   score can be null (title not available in Czech or English) — Kritiq shows an "N" badge
   and lets user votes establish a real score from scratch rather than inventing one. Shape:
   { "movies":[{title,year,date,score,box,genre,poster,gallery:[],summary,director,composer,writer,actors:[]}, ...],
     "shows": [{title,year,date,score,genre,poster,gallery:[],summary,director,composer,writer,actors:[]}, ...],
     "games": [{title,year,date,score,genre,poster,gallery:[],developer}, ...] }               */
let FULL_CATALOG_READY=false;
let FULL_CATALOG_PROMISE=null;
let RECENT_CATALOG_READY=false;
let resolveRecentCatalogReady;
let RECENT_CATALOG_PROMISE=new Promise(resolve=>{ resolveRecentCatalogReady=resolve; });
function markRecentCatalogReady(){
  if(RECENT_CATALOG_READY) return;
  RECENT_CATALOG_READY=true;
  resolveRecentCatalogReady();
}
function widenYearBoundsPreservingSelection(){
  // Called once the full catalog finishes loading in the background. Widens the slider's
  // ALLOWED range to the true min/max, but only moves the user's CURRENT selection if it
  // still exactly matches the narrower phase-1 default — if they've already customized
  // the slider, their choice is left alone rather than jumping underneath them.
  ['movie','show','game'].forEach(type=>{
    const years=DB[type].map(it=>it.year).filter(y=>Number.isFinite(y));
    if(!years.length) return;
    const newMin=Math.min(...years), newMax=Math.max(...years);
    const key=type==='movie'?'movies':type==='show'?'shows':'games';
    const st=listState[key];
    const oldBounds=YEAR_BOUNDS[type];
    if(st.y0===oldBounds.min) st.y0=newMin;
    if(st.y1===oldBounds.max) st.y1=newMax;
    YEAR_BOUNDS[type]={min:newMin, max:newMax};
  });
}
async function loadTrendingLight(){
  try{
    const res=await fetch('./trending.json', {cache:'no-store'});
    if(!res.ok) return null;
    const data=await res.json();
    if(!data || (!data.movies && !data.shows && !data.games)) return null;
    return {
      movie: buildFromRecords(data.movies||[], 'movie', 'm'),
      show: buildFromRecords(data.shows||[], 'show', 's'),
      game: buildFromRecords(data.games||[], 'game', 'g'),
    };
  }catch(e){ return null; }
}
function parseBucketFilename(filename){
  const m=filename.match(/^([a-z_]+?)(\d{4})-(\d{4})\.json$/);
  if(!m) return null;
  return {filename, prefix:m[1], startYear:+m[2], endYear:+m[3]};
}
function mergeBucketResults(filenames, results, movies, moviesCzSk, shows, games){
  filenames.forEach((filename, i)=>{
    const records=results[i] || [];
    if(filename.startsWith('movies_czsk')) moviesCzSk.push(...records);
    else if(filename.startsWith('movies')) movies.push(...records);
    else if(filename.startsWith('shows')) shows.push(...records);
    else if(filename.startsWith('games')) games.push(...records);
  });
}
async function loadOneJSON(path){
  try{
    const res=await fetch(path, {cache:'no-store'});
    if(!res.ok) return null;
    const json=await res.json();
    return Array.isArray(json) ? json : null;
  }catch(e){ return null; }
}
async function loadRealData(){
  const manifest = await loadOneJSON('./manifest.json');
  if(manifest && manifest.length){
    const parsed=manifest.map(parseBucketFilename).filter(Boolean);
    if(parsed.length){
      // PHASE 1: identify and load just the most-recent-year bucket per category —
      // fast, and enough for the default list view (which sorts by score within that
      // range but never needs older years unless the visitor explicitly asks for them).
      const byPrefix={};
      parsed.forEach(info=>{ if(!byPrefix[info.prefix] || info.endYear>byPrefix[info.prefix].endYear) byPrefix[info.prefix]=info; });
      const recentInfos=Object.values(byPrefix);
      const recentFiles=recentInfos.map(info=>info.filename);
      const recentResults=await Promise.all(recentFiles.map(f=>loadOneJSON('./'+f)));

      const movies=[], moviesCzSk=[], shows=[], games=[];
      mergeBucketResults(recentFiles, recentResults, movies, moviesCzSk, shows, games);
      DB.movie=buildFromRecords(movies.concat(moviesCzSk), 'movie', 'm');
      DB.show=buildFromRecords(shows, 'show', 's');
      DB.game=buildFromRecords(games, 'game', 'g');
      applyAdminOverridesToDB();

      const recentRangeFor=(prefixes)=>{
        const infos=recentInfos.filter(info=>prefixes.includes(info.prefix));
        if(!infos.length) return null;
        return {min:Math.min(...infos.map(i=>i.startYear)), max:Math.max(...infos.map(i=>i.endYear))};
      };
      YEAR_BOUNDS.movie=recentRangeFor(['movies','movies_czsk']) || YEAR_BOUNDS.movie;
      YEAR_BOUNDS.show=recentRangeFor(['shows']) || YEAR_BOUNDS.show;
      YEAR_BOUNDS.game=recentRangeFor(['games']) || YEAR_BOUNDS.game;
      listState.movies.y0=YEAR_BOUNDS.movie.min; listState.movies.y1=YEAR_BOUNDS.movie.max;
      listState.shows.y0=YEAR_BOUNDS.show.min; listState.shows.y1=YEAR_BOUNDS.show.max;
      listState.games.y0=YEAR_BOUNDS.game.min; listState.games.y1=YEAR_BOUNDS.game.max;
      markRecentCatalogReady();

      // PHASE 2: everything else, in the background
      const otherFiles=manifest.filter(f=>!recentFiles.includes(f));
      if(otherFiles.length){
        const otherResults=await Promise.all(otherFiles.map(f=>loadOneJSON('./'+f)));
        mergeBucketResults(otherFiles, otherResults, movies, moviesCzSk, shows, games);
      }
      DB.movie=buildFromRecords(movies.concat(moviesCzSk), 'movie', 'm');
      DB.show=buildFromRecords(shows, 'show', 's');
      DB.game=buildFromRecords(games, 'game', 'g');
      return true;
    }
    // Manifest exists but nothing parsed as a proper year-bucket filename (e.g. a custom
    // setup) — fall back to loading everything at once, same as before this change.
    const results=await Promise.all(manifest.map(f=>loadOneJSON('./'+f)));
    const movies=[], moviesCzSk=[], shows=[], games=[];
    mergeBucketResults(manifest, results, movies, moviesCzSk, shows, games);
    DB.movie=buildFromRecords(movies.concat(moviesCzSk), 'movie', 'm');
    DB.show=buildFromRecords(shows, 'show', 's');
    DB.game=buildFromRecords(games, 'game', 'g');
    return true;
  }
  // No manifest found — fall back to the older single-file-per-category scheme, for
  // deployments that haven't migrated to year-bucketed files yet.
  const [movies, moviesCzSk, shows, games] = await Promise.all([
    loadOneJSON('./movies.json'), loadOneJSON('./movies_czsk.json'), loadOneJSON('./shows.json'), loadOneJSON('./games.json')
  ]);
  if(movies===null && moviesCzSk===null && shows===null && games===null) return false; // nothing at all -> demo data fallback
  const allMovies=(movies||[]).concat(moviesCzSk||[]);
  DB.movie=buildFromRecords(allMovies, 'movie', 'm');
  DB.show=buildFromRecords(shows||[], 'show', 's');
  DB.game=buildFromRecords(games||[], 'game', 'g');
  return true;
}

let CURRENT_USER=null;       // the chosen nickname, once resolved — null while signed out or still resolving
let CURRENT_UID=null;        // Firebase's own user id, always available immediately after sign-in

let pendingFirebaseUser=null; // set when a signed-in Firebase user has no nickname yet

function slugifyNickname(raw){
  return (raw||'').trim().toLowerCase();
}

async function lookupNicknameForUid(uid){
  const doc = await db.collection('users').doc(uid).get();
  return doc.exists ? doc.data().nickname : null;
}

async function claimNickname(uid, nickname, email){
  const key = slugifyNickname(nickname);
  const usernameRef = db.collection('usernames').doc(key);
  const existing = await usernameRef.get();
  if(existing.exists) return false; // already taken
  await usernameRef.set({uid});
  await db.collection('users').doc(uid).set({nickname, email: email||null, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  return true;
}

fbAuth.onAuthStateChanged(async (user)=>{
  if(!user){
    CURRENT_USER=null; CURRENT_UID=null; pendingFirebaseUser=null; MY_FAVORITES=[];
    renderAuthBadge();
    return;
  }
  CURRENT_UID=user.uid;
  const nickname = await lookupNicknameForUid(user.uid);
  if(nickname){
    CURRENT_USER=nickname;
    pendingFirebaseUser=null;
    await loadMyFavorites();
    renderAuthBadge();
    closeAllModals(); // done — whether they came from the login modal, register modal, or nickname picker
  }else{
    // Signed in with Firebase, but no nickname claimed yet (brand-new account) —
    // hold off treating them as logged in until they pick one.
    pendingFirebaseUser=user;
    renderAuthBadge();
    openNicknamePickerModal();
  }
});

    'auth/user-not-found':'Nesprávný e-mail nebo heslo.',
    'auth/wrong-password':'Nesprávný e-mail nebo heslo.',

    'auth/weak-password':'Heslo je příliš slabé.',
    'auth/popup-closed-by-user':'Přihlášení přes Google bylo zrušeno.',
  };

  if(!/^(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$/.test(pass)){ authError='Heslo musí mít alespoň 8 znaků, 1 číslo a 1 speciální znak.'; renderAuthModal(); return; }
  if(pass!==pass2){ authError='Hesla se neshodují.'; renderAuthModal(); return; }
  try{
    await fbAuth.createUserWithEmailAndPassword(email, pass);

    renderAuthModal();
  }

function triggerAvatarUpload(username, onDone){
  if(!CURRENT_UID){ openAuthModal('login'); return; }
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.addEventListener('change', async ()=>{
    const file=input.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ alert('Vyberte prosím obrázek.'); return; }
    if(file.size > 10*1024*1024){ alert('Obrázek je příliš velký (max. 10 MB).'); return; }
    try{
      const dataUrl=await resizeImageToDataUrl(file, 200);
      await db.collection('users').doc(CURRENT_UID).set({avatarData:dataUrl}, {merge:true});
      if(onDone) onDone();
    }catch(e){
      console.error('Nepodařilo se nahrát profilovou fotku', e);
      alert('Nepodařilo se nahrát profilovou fotku. Zkuste to prosím znovu.');
    }
  });
  input.click();
}
function resizeImageToDataUrl(file, targetSize){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=targetSize; canvas.height=targetSize;
        const ctx=canvas.getContext('2d');
        // Center-crop to a square first, so the avatar isn't stretched/distorted by a
        // non-square source photo, then scale down to keep the stored size small.
        const side=Math.min(img.width, img.height);
        const sx=(img.width-side)/2, sy=(img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, targetSize, targetSize);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror=()=>reject(new Error('Nepodařilo se načíst obrázek.'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('Nepodařilo se přečíst soubor.'));
    reader.readAsDataURL(file);
  });
}

/* ======================= MODAL STACK ======================= */
/* Each entry is a render function that redraws the current modal content into #reviewModalCard.
   Opening a new modal pushes onto the stack (previous stays underneath); the X button pops one
   level back to whatever was open before, and only empties + hides the overlay once the stack
   is empty. Backdrop click / Escape / navigating away clear the whole stack at once. */
let modalStack=[];
function pushModal(renderFn){
  modalStack.push(renderFn);
  renderTopModal();
}
async function renderTopModal(){
  if(!modalStack.length) return;
  document.getElementById('reviewModalOverlay').classList.add('open');
  if(!FULL_CATALOG_READY){
    const card=document.getElementById('reviewModalCard');
    if(card){ card.className='modal-card'; card.innerHTML=`<p class="empty-note" style="padding:20px 0;">Načítání...</p>`; }
    await FULL_CATALOG_PROMISE;
    if(!modalStack.length) return; // stack could've been cleared while we were waiting
  }
  modalStack[modalStack.length-1]();
}
function popModal(){
  modalStack.pop();
  if(modalStack.length) renderTopModal();
  else closeAllModals();
}
function closeAllModals(){
  modalStack=[];
  document.getElementById('reviewModalOverlay').classList.remove('open');
}

  }catch(e){
    console.error('Nepodařilo se načíst oblíbené uživatele profilu', username, e);

  const enriched = await Promise.all(list.map(async (u)=>({username:u, agg:userAggregate(await getUserReviewsAsync(u))})));

        ${username!==CURRENT_USER ? `<button class="profile-fav-btn ${isFav?'active':''}" id="modalFavBtn" title="${isFav?'Odebrat z oblíbených':'Přidat mezi oblíbené'}" type="button">${ICON_PLUS}</button>` : ''}
      </div>
      <button class="fav-users-btn" id="modalTop10ViewBtn" type="button">OSOBNÍ TOP 10</button>
      <button class="fav-users-btn" id="modalFavUsersBtn" type="button">Oblíbení uživatelé</button>
      <button class="fav-users-btn fav-users-btn-blue" id="modalAchievementsViewBtn" type="button">Achievmenty</button>
      <button class="fav-users-btn fav-users-btn-gold" id="modalQuestsViewBtn" type="button">Týdenní questy</button>
    </div>
    <h3 class="section-title">Poslední 3 recenze</h3>
    <div class="reviews-list" id="modalReviewsList">${body.html}</div>
  `;
  document.getElementById('modalProfileCloseBtn').addEventListener('click', popModal);
  document.getElementById('modalTop10ViewBtn').addEventListener('click', ()=> openTop10ViewModal(username));
  document.getElementById('modalFavUsersBtn').addEventListener('click', ()=> openFavoritesModal(username));
  document.getElementById('modalAchievementsViewBtn').addEventListener('click', ()=> openAchievementsModalFor(username));
  document.getElementById('modalQuestsViewBtn').addEventListener('click', ()=> openQuestsModalFor(username));
  document.getElementById('modalAvatarBtn').addEventListener('click', ()=>{
    if(username===CURRENT_USER){
      triggerAvatarUpload(username, renderUserModal);
    }else{
      openFavoritesModal(username);
    }
  });
  document.getElementById('modalFavBtn')?.addEventListener('click', async ()=>{
    await toggleMyFavorite(username);
    renderUserModal();
  });
  document.getElementById('modalCopyLinkBtn').addEventListener('click', (e)=> copyProfileLink(username, e.currentTarget));
  bindShowAllReviews(username);
}
function copyProfileLink(username, btnEl){
  const url=location.origin+location.pathname+'#/user/'+encodeURIComponent(username);
  const done=()=>{
    const original=btnEl.innerHTML;
    btnEl.innerHTML=ICON_CHECK;
    btnEl.classList.add('copied');
    setTimeout(()=>{ btnEl.innerHTML=original; btnEl.classList.remove('copied'); }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  }else{
    fallbackCopy(url,done);
  }
}
function fallbackCopy(text, cb){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    if(cb) cb();
  }catch(e){}
}

/* ======================= SEARCH PANEL ======================= */
function initSearchPanel(){
  const toggleBtn=document.getElementById('searchToggle');
  const panel=document.getElementById('searchPanel');
  const input=document.getElementById('searchPanelInput');
  const results=document.getElementById('searchPanelResults');

  function closePanel(){ panel.classList.remove('open'); toggleBtn.classList.remove('active'); }
  function openPanel(){
    panel.classList.add('open'); toggleBtn.classList.add('active');
    setTimeout(()=>input.focus(), 60);
  }
  function renderResults(q){
    if(!q){ results.innerHTML=''; return; }
    const titleMatches=searchTitles(q);
    const peopleMatches=searchPeople(q);
    if(!titleMatches.length && !peopleMatches.length){ results.innerHTML=`<div class="search-empty-note">Nic jsme nenašli pro "${esc(q)}".</div>`; return; }
    const peopleHTML=peopleMatches.slice(0,5).map(p=>{
      const h=hashStr(p.name);
      const style=`background:linear-gradient(135deg, hsl(${h%360} 60% 45%), hsl(${(h+70)%360} 65% 30%));`;
      const inner=p.image ? `<img src="${esc(p.image)}" alt="" class="avatar-photo">` : esc(p.name.charAt(0));
      return `<a class="search-result-row search-result-person" href="#/person/${encodeURIComponent(p.name)}"><span class="person-search-avatar" style="${style}">${inner}</span><span class="srr-title">${esc(p.name)}</span></a>`;
    }).join('');
    const titleHTML=titleMatches.slice(0,20).map(it=>{
      const sc=liveScore(it); const badge=scoreBadge(sc);
      const meta=(it.type==='movie' && it.box!==null && it.box!==undefined) ? `${fmtBox(it.box, it.boxCurrency)} · ${it.year}` : `${it.year}`;
      return `<a class="search-result-row" href="#/title/${it.type}/${it.id}"><span class="srr-title">${esc(it.title)}</span><span class="srr-meta">${typeLabel(it.type)} · ${meta}</span><span class="srr-score ${badge.cls}">${badge.text}</span></a>`;
    }).join('');
    results.innerHTML=peopleHTML+titleHTML;
  }

  toggleBtn.addEventListener('click', ()=>{
    if(panel.classList.contains('open')) closePanel();
    else { openPanel(); renderResults(input.value.trim()); }
  });
  input.addEventListener('input', ()=> renderResults(input.value.trim()));
  document.addEventListener('click', e=>{
    if(panel.classList.contains('open') && !panel.contains(e.target) && !toggleBtn.contains(e.target)) closePanel();
  });
  window.addEventListener('hashchange', closePanel);
  window._closeSearchPanel=closePanel;
}

/* ===== ADMIN: manual data corrections layered on top of the static catalog =====
   The catalog itself lives in static JSON files (regenerated by the fetch script), not
   Firestore — so edits here don't touch that data directly. Instead, a small Firestore
   collection stores just the fields that were manually overridden, keyed by item id, and
   they're re-applied on top of the catalog every time it loads. This means edits survive
   future re-fetches automatically, since the override layer is entirely independent of
   the JSON files themselves. */
const ADMIN_UID='xi7dBc7SwxZDGC3ZSjcoQnO1rzh1'; // Firebase Console -> Authentication -> your account -> User UID
function isAdmin(){ return !!CURRENT_UID && CURRENT_UID===ADMIN_UID; }
let ADMIN_OVERRIDES_CACHE=null;
async function loadAdminOverrides(){
  try{
    const snap=await db.collection('adminOverrides').get();
    const map={};
    snap.docs.forEach(doc=>{ map[doc.id]=doc.data(); });
    ADMIN_OVERRIDES_CACHE=map;
  }catch(e){
    console.error('Nepodařilo se načíst admin úpravy', e);
    ADMIN_OVERRIDES_CACHE={};
  }
}
function applyAdminOverridesToDB(){
  if(!ADMIN_OVERRIDES_CACHE) return;
  ['movie','show','game'].forEach(type=>{
    DB[type].forEach(item=>{
      const o=ADMIN_OVERRIDES_CACHE[item.id];
      if(!o) return;
      if(o.title) item.title=o.title;
      if(o.summary) item.summary=o.summary;
      if(o.score!==undefined && o.score!==null) item.baseScore=o.score;
      if(o.country) item.country=o.country;
      if(o.duration!==undefined && o.duration!==null){
        if(item.type==='movie') item.runtime=o.duration;
        else if(item.type==='show'){ item.runtimeMin=o.duration; item.runtimeMax=o.duration; }
      }
      if(o.developer) item.developer=o.developer;
    });
  });
}
async function saveAdminOverride(item, fields){
  if(!isAdmin()) return false;
  try{
    await db.collection('adminOverrides').doc(item.id).set(
      Object.assign({type:item.type}, fields, {updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),
      {merge:true}
    );
    if(!ADMIN_OVERRIDES_CACHE) ADMIN_OVERRIDES_CACHE={};
    ADMIN_OVERRIDES_CACHE[item.id]=Object.assign({}, ADMIN_OVERRIDES_CACHE[item.id]||{}, fields);
    applyAdminOverridesToDB(); // re-apply immediately so the current page reflects it without a reload
    return true;
  }catch(e){
    console.error('Nepodařilo se uložit admin úpravu', e);
    return false;
  }
}

async function loadFullCatalog(){
  const [loadedReal]=await Promise.all([loadRealData(), loadAdminOverrides()]);
  if(!loadedReal){
    DB.movie=buildMovies();
    DB.show=buildShows();
    DB.game=buildGames();
    restoreAddedItems();
    runDailyDrop(); // simulated placeholder content — demo dataset only, never with real fetched data
  }
  applyAdminOverridesToDB();
  widenYearBoundsPreservingSelection();
  markRecentCatalogReady(); // safety net — ensures this is true even when loadRealData() never got to do a two-phase split (demo mode, or the older single-file scheme)
  FULL_CATALOG_READY=true;
  return loadedReal;
}
let TRENDING_HOME_DATA=null; // cached separately from DB — keeps the homepage showing the SAME server-chosen selection even after DB gets replaced by the full catalog, instead of re-deriving a different set client-side
async function init(){
  FULL_CATALOG_PROMISE=loadFullCatalog(); // kicked off immediately, not awaited yet — runs in the background
  FULL_CATALOG_PROMISE.then(()=>{
    const parts=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
    if(['movies','shows','games'].includes(parts[0])) route(); // re-render so the slider's widened bounds take effect; current y0/y1 selection is preserved
  });

  const trending=await loadTrendingLight();
  if(trending && !RECENT_CATALOG_READY){
    DB.movie=trending.movie; DB.show=trending.show; DB.game=trending.game;
    TRENDING_HOME_DATA=trending;
    // Rough placeholder bounds from the small trending subset — the phase-1 (recent
    // bucket) load inside loadFullCatalog() corrects this shortly, then the full
    // background load corrects it further once everything has arrived.
  }else if(!trending){
    await FULL_CATALOG_PROMISE; // no lightweight file available (e.g. demo/preview) — wait for the real thing before first render
  }
  // else: trending.json loaded, but the full catalog RACE-WON and finished first — DB
  // already correctly holds the full catalog with matching YEAR_BOUNDS, so trending data
  // is deliberately discarded here rather than overwriting it.

  initSearchPanel();
  renderAuthBadge();
  document.getElementById('footerPrivacyBtn')?.addEventListener('click', ()=> openPolicyModal('privacy'));
  document.getElementById('footerTermsBtn')?.addEventListener('click', ()=> openPolicyModal('terms'));

  document.addEventListener('click', e=>{
    const profileLink=e.target.closest('.profile-link');
    if(profileLink){ e.preventDefault(); openUserModal(profileLink.dataset.username); return; }
    const editBtn=e.target.closest('.pill-edit-btn');
    if(editBtn){
      const it=findItem(itemTypeFromId(editBtn.dataset.itemId), editBtn.dataset.itemId);
      const rev=it && allReviews(it).find(r=>r.id===editBtn.dataset.reviewId);
      if(it && rev) openEditReviewModal(it, rev);
      return;
    }
    const deleteBtn=e.target.closest('.pill-delete-btn');
    if(deleteBtn){
      const it=findItem(itemTypeFromId(deleteBtn.dataset.itemId), deleteBtn.dataset.itemId);
      if(it) openDeleteConfirmModal(it);
      return;
    }
    if(e.target.closest('.no-modal-trigger')) return;
    ['platformDropdown','genreFilterDropdown'].forEach(id=>{
      const dropdown=document.getElementById(id);
      if(dropdown && dropdown.classList.contains('open') && !e.target.closest('.platform-filter-wrap')){
        dropdown.classList.remove('open');
      }
    });
    const reviewEl=e.target.closest('.review-item');
    if(reviewEl){ openReviewModalById(reviewEl.dataset.itemId, reviewEl.dataset.reviewId); return; }
  });
  document.getElementById('reviewModalOverlay').addEventListener('click', e=>{
    if(e.target.id==='reviewModalOverlay') closeAllModals();
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeAllModals(); if(window._closeSearchPanel) window._closeSearchPanel(); }
  });
  window.addEventListener('hashchange', closeAllModals);

  window.addEventListener('hashchange', route);
  route();
}
init();
</script>
