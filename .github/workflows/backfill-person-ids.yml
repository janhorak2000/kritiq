name: Backfill person ids

on:
  workflow_dispatch:   # manual trigger only — this is a one-time migration, not a recurring job.
                        # Safe to run again later if needed: already-backfilled records are
                        # detected and skipped, so no wasted API calls on a second run.

permissions:
  contents: write   # required so the final "git push" step below can actually write back to the repo

concurrency:
  group: kritiq-data-commits   # shared across every workflow that commits generated data —
  cancel-in-progress: false     # queues them instead of letting two race to push at once.
                                 # false: never cancel a run partway through just because
                                 # another one is queued (a half-finished backfill/fetch is
                                 # worse than waiting).

jobs:
  backfill-person-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run person-id backfill
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python fetch_data_daily.py --backfill-person-ids-only --tmdb-key "$TMDB_KEY"

      - name: Commit and push (retries if the remote moved on while this ran)
        run: |
          git config user.name "kritiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          git commit -m "Backfill TMDb person ids onto existing movie/show credits"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (remote has moved on) — attempt $attempt/5, pulling and retrying..."
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || {
              echo "Rebase hit a real conflict (the remote touched the exact same lines this run changed) — needs manual resolution."
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "Still failed after 5 attempts. This run's backfilled data is safe on disk in this runner but wasn't pushed anywhere. Re-running this workflow is safe — already-backfilled records are detected and skipped — and should succeed once the conflicting activity quiets down."
          exit 1
