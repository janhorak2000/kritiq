<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kritiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150a22;
  --bg-1:#1c0f2c;
  --bg-2:#251638;
  --bg-3:#2f1c46;
  --line:#3a2454;
  --line-soft:#2a1840;
  --text:#f1ecfa;
  --text-dim:#b6a8cf;
  --text-faint:#8577a3;
  --violet:#9b5cf6;
  --violet-2:#c084fc;
  --magenta:#e264b8;
  --s-black-bg:#0a0810; --s-black-fg:#f1ecfa;
  --s-grey-bg:#585068;  --s-grey-fg:#f1ecfa;
  --s-blue-bg:#3f6fdb;  --s-blue-fg:#ffffff;
  --s-purple-bg:#9b3ff0; --s-purple-fg:#ffffff;
  --s-gold-bg:#e8b13a;  --s-gold-fg:#1c1204;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-display:'Unbounded', 'Manrope', sans-serif;
  --font-body:'Manrope', sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 12% -8%, #341f52 0%, transparent 60%),
    radial-gradient(900px 700px at 105% 15%, #2a1440 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--violet); color:#fff;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px; width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
:focus-visible{outline:2px solid var(--violet-2); outline-offset:2px; border-radius:4px;}

.wrap{max-width:1240px; margin:0 auto; padding:0 28px;}
@media(max-width:720px){.wrap{padding:0 16px;}}

/* ---------- HEADER ---------- */
header.site{
  position:sticky; top:0; z-index:50;
  background:rgba(21,10,34,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.header-row{
  max-width:1240px; margin:0 auto; padding:14px 28px;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:22px;
}
@media(max-width:720px){.header-row{padding:12px 16px; gap:12px;}}
.brand{
  display:flex; align-items:center; gap:4.5px; justify-self:start;
  font-family:var(--font-display); font-weight:800; font-size:21px;
  letter-spacing:.02em; text-transform:uppercase; white-space:nowrap;
}
.brand .dot{width:9px; height:9px; border-radius:3px; background:linear-gradient(135deg,var(--violet-2),var(--magenta)); box-shadow:0 0 14px rgba(192,132,252,.7);}
.brand-marks{display:flex; flex-direction:column; gap:2px; justify-content:center; flex:0 0 auto;}
.brand-marks .mark{width:4px; height:4px; border-radius:1px;}
.brand-marks .mark-gold{background:var(--s-gold-bg); box-shadow:0 0 8px rgba(232,177,58,.65);}
.brand-marks .mark-purple{background:var(--violet-2); box-shadow:0 0 8px rgba(192,132,252,.65);}
.brand-marks .mark-blue{background:var(--s-blue-bg); box-shadow:0 0 8px rgba(63,111,219,.65);}
nav.main-nav{
  justify-self:center; display:flex; gap:6px;
}
nav.main-nav a{
  padding:9px 18px; border-radius:999px; font-size:12px; font-weight:700;
  font-family:var(--font-display); letter-spacing:.02em;
  color:var(--text-dim); transition:color .15s, background .15s;
}
nav.main-nav a:hover{color:var(--text); background:var(--bg-2);}
nav.main-nav a.active{color:#fff; background:linear-gradient(135deg,var(--violet),var(--magenta)); box-shadow:0 4px 18px rgba(155,92,246,.35);}
.search-toggle{
  justify-self:end; width:38px; height:38px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim);
  cursor:pointer; transition:color .15s, border-color .15s, background .15s;
}
.search-toggle svg{width:17px; height:17px;}
.search-toggle:hover{color:#fff; border-color:var(--violet);}
.search-toggle.active{color:#fff; border-color:var(--violet); background:rgba(155,92,246,.18);}

.search-panel{max-height:0; overflow:hidden; transition:max-height .22s ease;}
.search-panel.open{max-height:440px; border-top:1px solid var(--line-soft);}
.search-panel-inner{max-width:1240px; margin:0 auto; padding:16px 28px 20px;}
.search-panel-box{
  display:flex; align-items:center; gap:10px;
  background:var(--bg-2); border:1px solid var(--line-soft); border-radius:999px; padding:10px 16px;
}
.search-panel-box svg{flex:0 0 auto; opacity:.6;}
.search-panel-box input{
  flex:1; background:none; border:none; outline:none; color:var(--text);
  font-family:inherit; font-size:14.5px;
}
.search-panel-box input::placeholder{color:var(--text-faint);}
.search-panel-results{margin-top:12px; display:flex; flex-direction:column; gap:3px; max-height:320px; overflow-y:auto;}
.search-result-row{
  display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:10px;
  transition:background .12s;
}
.search-result-row:hover{background:var(--bg-2);}
.srr-title{flex:1; min-width:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.srr-meta{flex:0 0 auto; font-size:11.5px; color:var(--text-faint);}
.srr-score{
  flex:0 0 auto; min-width:32px; height:26px; padding:0 7px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:12.5px;
}
.search-empty-note{color:var(--text-faint); font-size:13.5px; padding:14px 4px;}
@media(max-width:900px){
  nav.main-nav a{padding:9px 12px; font-size:11.5px;}
}
@media(max-width:640px){
  .header-row{gap:8px;}
  .brand{font-size:18px;}
  nav.main-nav{gap:2px;}
  nav.main-nav a{padding:8px 10px; font-size:11px;}
  .search-panel-inner{padding:14px 16px 18px;}
}

/* ---------- MAIN ---------- */
main{padding:34px 0 80px;}
.page-title{
  font-family:var(--font-display); font-weight:800; font-size:30px;
  margin:0 0 4px;
}
.page-sub{color:var(--text-faint); font-size:14.5px; margin:0 0 26px;}

/* ---------- HOME ROWS ---------- */
.hot-section{margin-bottom:38px;}
.hot-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px;}
.hot-head h2{font-family:var(--font-display); font-weight:600; font-size:15px; margin:0; color:#b3a0d9;}
.hot-head .hot-sub{color:var(--text-faint); font-size:13px; margin-top:2px;}
.hot-head .see-all{font-size:13px; font-weight:700; color:var(--violet-2); white-space:nowrap; flex:0 0 auto;}
.hot-row{
  display:flex; gap:14px; overflow-x:auto; padding:6px 2px 14px;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
}
.hot-card{
  position:relative; flex:0 0 auto; width:150px; scroll-snap-align:start;
}
.hot-card .card{position:relative; z-index:1; margin-right:28px;}
.hot-rank{
  position:absolute; right:14px; bottom:-6px; z-index:2;
  font-family:var(--font-display); font-weight:800; font-size:48px;
  color:var(--bg); -webkit-text-stroke:1.5px var(--line);
  line-height:1; pointer-events:none; opacity:.9;
}
@media(max-width:520px){
  .hot-section{margin-bottom:30px;}
  .hot-head h2{font-size:16.5px;}
  .hot-head .hot-sub{font-size:11.5px;}
  .hot-card{width:118px;}
  .hot-card .card{margin-right:20px;}
  .hot-rank{font-size:36px; right:16px; bottom:-4px;}
  .poster .letter{font-size:48px;}
  .card-title{font-size:12px;}
  .card-meta{font-size:10.5px;}
  .score-chip{height:22px; min-width:28px; font-size:11px;}
}

/* ---------- CARDS ---------- */
.card{
  display:block; border-radius:var(--radius-m); overflow:hidden;
  background:var(--bg-2); border:1px solid var(--line-soft);
  transition:transform .18s ease, border-color .18s ease;
}
.card:hover{transform:translateY(-4px); border-color:var(--line);}
.poster{
  position:relative; aspect-ratio:2/3; width:100%; overflow:hidden;
}
.poster .letter{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:64px; color:rgba(255,255,255,.22);
}
.poster .scrim{
  position:absolute; left:0; right:0; bottom:0; height:56%;
  background:linear-gradient(to top, rgba(10,6,18,.92), transparent);
}
.score-chip{
  position:absolute; top:8px; right:8px; z-index:3;
  min-width:34px; height:26px; padding:0 7px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.new-badge{
  position:absolute; top:8px; left:8px; z-index:3;
  background:var(--magenta); color:#fff; font-size:10px; font-weight:800;
  padding:3px 7px; border-radius:6px; letter-spacing:.03em;
}
.card-body{position:absolute; left:0; right:0; bottom:0; padding:9px 10px 10px;}
.card-title{font-size:13.5px; font-weight:700; line-height:1.2; margin:0; color:#fff;}
.card-meta{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

/* score color classes */
.s-black{background:var(--s-black-bg); color:var(--s-black-fg); border:1px solid #2a2236;}
.s-grey{background:var(--s-grey-bg); color:var(--s-grey-fg);}
.s-blue{background:var(--s-blue-bg); color:var(--s-blue-fg);}
.s-purple{background:var(--s-purple-bg); color:var(--s-purple-fg);}
.s-gold{background:var(--s-gold-bg); color:var(--s-gold-fg); box-shadow:0 0 16px rgba(232,177,58,.55), 0 3px 10px rgba(0,0,0,.4);}

/* ---------- FILTER BAR ---------- */
.filterbar{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  padding:16px 20px; margin-bottom:26px;
}
.filterbar .label{font-size:12.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
.range-field{display:flex; align-items:center; gap:12px; flex:1 1 260px; min-width:220px;}
.range-track{position:relative; flex:1; height:4px; background:var(--line); border-radius:4px;}
.range-track .fill{position:absolute; height:100%; background:linear-gradient(90deg,var(--violet),var(--magenta)); border-radius:4px;}
.range-field input[type=range]{
  position:absolute; left:0; top:-9px; width:100%; margin:0;
  -webkit-appearance:none; appearance:none; background:none; pointer-events:none; height:22px;
}
.range-field input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; pointer-events:all;
  width:18px; height:18px; border-radius:50%;
  background:#fff; border:3px solid var(--violet);
  cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.range-field input[type=range]::-moz-range-thumb{
  pointer-events:all; width:12px; height:12px; border-radius:50%;
  background:#fff; border:3px solid var(--violet); cursor:pointer;
}
.range-wrap{position:relative; flex:1; height:4px;}
.year-readout{font-family:var(--font-display); font-weight:700; font-size:14.5px; white-space:nowrap; color:var(--text);}
.sortsel{
  margin-left:auto; background:var(--bg-2); color:var(--text); border:1px solid var(--line-soft);
  border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; font-family:inherit;
}

/* ---------- GRID ---------- */
.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(158px,1fr)); gap:18px;
}
.empty-note{color:var(--text-faint); padding:40px 0; text-align:center; font-size:14px;}
.load-more-wrap{display:flex; justify-content:center; padding:30px 0 10px;}
.load-more-btn{
  padding:11px 26px; border-radius:999px; cursor:pointer;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text);
  font-weight:700; font-size:13.5px; transition:border-color .15s, background .15s;
}
.load-more-btn:hover{background:var(--bg-3); border-color:var(--violet);}

/* ---------- DETAIL ---------- */
.detail-top{margin-bottom:38px;}
.detail-header{margin-bottom:22px;}
.detail-header h1{font-family:var(--font-display); font-weight:800; font-size:clamp(26px,4vw,40px); margin:0 0 8px; line-height:1.05;}
.detail-meta-line{color:var(--text-dim); font-size:14.5px; margin-bottom:0; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.detail-meta-line .sep{opacity:.4;}

.detail-row{display:flex; align-items:flex-start; gap:20px; margin-bottom:22px;}
.credits{display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-width:0;}
.credit-row{display:flex; gap:10px; font-size:14px; align-items:baseline; flex-wrap:wrap;}
.credit-row .ck-label{color:var(--text-faint); min-width:96px; font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; padding-top:3px;}
.credit-row .ck-values{display:flex; gap:6px; flex-wrap:wrap;}
.person-link{
  color:var(--violet-2); font-weight:600; padding:3px 10px; border-radius:999px;
  background:rgba(155,92,246,.12); border:1px solid rgba(155,92,246,.28);
  transition:background .15s, color .15s;
}
.person-link:hover{background:rgba(155,92,246,.28); color:#fff;}

.detail-poster-small{flex:0 0 108px; width:108px; align-self:flex-start; margin-left:auto; cursor:pointer;}
.detail-poster-small:hover .frame{transform:rotate(-2deg) scale(1.03);}
@media(max-width:480px){.detail-poster-small{flex-basis:76px; width:76px;}}
.detail-poster-small .frame{
  aspect-ratio:2/3; border-radius:var(--radius-m); overflow:hidden; width:100%;
  position:relative; transform:rotate(-2deg); box-shadow:0 14px 30px -10px rgba(0,0,0,.6), 0 0 0 1px var(--line-soft);
  transition:transform .15s ease;
}
.detail-poster-small .frame::after{content:''; position:absolute; inset:0; box-shadow:inset 0 0 30px rgba(0,0,0,.35);}
.detail-poster-small .frame .letter{font-size:40px;}
@media(max-width:480px){.detail-poster-small .frame .letter{font-size:28px;}}

.score-bar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:18px 26px; border-radius:var(--radius-l); margin-bottom:22px;
}
.score-bar .num{font-family:var(--font-display); font-weight:800; font-size:42px; line-height:1;}
.score-bar .lbl{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
.score-bar .votes{font-size:12.5px; opacity:.8; margin-left:auto;}
@media(max-width:520px){.score-bar{padding:14px 18px;} .score-bar .num{font-size:34px;}}

.section-title{font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 14px;}
.block{margin-bottom:36px;}
.synopsis{color:var(--text-dim); font-size:15px; line-height:1.65; max-width:74ch;}

/* rate widget: slider with colored readout */
.rate-slider-row{display:flex; align-items:center; gap:18px; margin-bottom:18px;}
.rate-num{
  flex:0 0 auto; min-width:58px; height:44px; padding:0 10px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:19px;
  transition:background .12s, color .12s;
}
.rate-track-wrap{flex:1; min-width:0; display:flex; align-items:center; height:26px;}
.rate-track-wrap input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; margin:0; cursor:pointer;
  background:linear-gradient(to right,
    var(--s-black-bg) 0%, var(--s-black-bg) 1%,
    var(--s-grey-bg) 1%, var(--s-grey-bg) 49%,
    var(--s-blue-bg) 49%, var(--s-blue-bg) 69%,
    var(--s-purple-bg) 69%, var(--s-purple-bg) 89%,
    var(--s-gold-bg) 89%, var(--s-gold-bg) 100%);
}
.rate-track-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:24px; height:24px; border-radius:50%;
  background:var(--thumb-color, #fff); border:3px solid #fff;
  box-shadow:0 2px 10px rgba(0,0,0,.5); cursor:pointer;
}
.rate-track-wrap input[type=range]::-moz-range-track{
  height:8px; border-radius:999px;
  background:linear-gradient(to right,
    var(--s-black-bg) 0%, var(--s-black-bg) 1%,
    var(--s-grey-bg) 1%, var(--s-grey-bg) 49%,
    var(--s-blue-bg) 49%, var(--s-blue-bg) 69%,
    var(--s-purple-bg) 69%, var(--s-purple-bg) 89%,
    var(--s-gold-bg) 89%, var(--s-gold-bg) 100%);
}
.rate-track-wrap input[type=range]::-moz-range-thumb{
  width:20px; height:20px; border-radius:50%; border:3px solid #fff;
  background:var(--thumb-color, #fff); box-shadow:0 2px 10px rgba(0,0,0,.5); cursor:pointer;
}
.review-form textarea{
  width:100%; min-height:96px; resize:none; overflow:hidden; box-sizing:border-box; border-radius:var(--radius-m);
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text);
  padding:14px 16px; font-family:inherit; font-size:14.5px; line-height:1.5; outline:none;
}
.review-form textarea:focus{border-color:var(--violet);}
.review-form{background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-l); padding:22px;}
.review-submit{
  margin-top:12px; padding:10px 22px; border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:14px;
}
.review-submit:disabled{opacity:.4; cursor:not-allowed;}
.form-note{font-size:12.5px; color:var(--text-faint); margin-top:8px;}

.reviews-list{display:flex; flex-direction:column; gap:12px; margin-top:20px;}
.review-item{
  display:flex; gap:14px; padding:16px 18px; border-radius:var(--radius-m);
  background:var(--bg-1); border:1px solid var(--line-soft);
  cursor:pointer; transition:border-color .15s, background .15s;
}
.review-item:hover{border-color:var(--violet); background:var(--bg-2);}
.review-score{
  flex:0 0 auto; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:15px;
}
.review-body{min-width:0; flex:1 1 auto;}
.review-author-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; flex-wrap:wrap;}
.review-author-link, .review-context-link{font-weight:700; font-size:13.5px; color:var(--text); text-decoration:none;}
.review-author-link:hover, .review-context-link:hover{color:var(--violet-2); text-decoration:underline;}
.review-context-link{color:var(--text-dim); font-weight:600;}
.review-reactions-mini{display:flex; align-items:center; gap:12px; flex:0 0 auto;}
.mini-react{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-faint); font-weight:600;}
.mini-react svg{width:13px; height:13px;}
.review-text{
  color:var(--text-dim); font-size:14px; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}

/* review modal */
.modal-overlay{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  background:rgba(8,4,14,.7); backdrop-filter:blur(6px); padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  width:100%; max-width:540px; max-height:86vh; overflow-y:auto;
  background:var(--bg-1); border:1px solid var(--line-soft); border-radius:var(--radius-l);
  padding:26px 26px 22px; position:relative;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
}
.modal-close{
  position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
  background:var(--bg-2); border:1px solid var(--line-soft); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; line-height:1;
}
.modal-close:hover{color:#fff; border-color:var(--violet);}
.modal-review-head{display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-right:36px;}
.modal-review-score{
  flex:0 0 auto; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:18px;
}
.modal-review-author{font-weight:700; font-size:15px; color:var(--text); text-decoration:none;}
.modal-review-author:hover{color:var(--violet-2); text-decoration:underline;}
.modal-review-text{color:var(--text-dim); font-size:15px; line-height:1.65; margin-bottom:22px; white-space:pre-wrap;}

/* ======================= HELPERS ======================= */
function hashStr(s){let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;} return h;}
function posterStyle(seed){
  const h=hashStr(seed);
  const h1=h%360, h2=(h1+55)%360;
  return `background:linear-gradient(150deg, hsl(${h1} 62% 38%), hsl(${h2} 70% 16%));`;
}
function scoreClass(score){
  if(score<=0) return 's-black';
  if(score<50) return 's-grey';
  if(score<70) return 's-blue';
  if(score<90) return 's-purple';
  return 's-gold';
}
const SCORE_HEX={'s-black':'#0a0810','s-grey':'#585068','s-blue':'#3f6fdb','s-purple':'#9b3ff0','s-gold':'#e8b13a'};

  const [y,m,day]=d.split('-');
  return `${parseInt(day)}. ${months[parseInt(m)-1]} ${y}`;
}

/* deterministic synthetic "who favorites whom" graph among the demo reviewer pool */
const FAVORITES_SEED={};
REVIEW_AUTHORS.forEach(author=>{
  const n=2+(hashStr(author+'favn')%5);
  const list=[];
  for(let k=0;k<n;k++){
    const candidate=REVIEW_AUTHORS[hashStr(author+'fav'+k)%REVIEW_AUTHORS.length];
    if(candidate!==author && !list.includes(candidate)) list.push(candidate);
  }
  FAVORITES_SEED[author]=list;
});
function favBaseCount(username){ return hashStr(username+'favcount')%45; }

function seedReviews(id, base){
  const arr=[]; const n=2+(hashStr(id)%3);
  for(let i=0;i<n;i++){
    const off=((hashStr(id+i)%21)-10);
    let sc=Math.max(0,Math.min(100, base+off));
    sc=Math.round(sc/5)*5;
    arr.push({
      id: id+'-seed-'+i,
      author:REVIEW_AUTHORS[(hashStr(id)+i)%REVIEW_AUTHORS.length], score:sc, text:REVIEW_SNIPPETS[(hashStr(id)+i*3)%REVIEW_SNIPPETS.length],
      baseLikes: hashStr(id+'like'+i)%38,
      baseDislikes: hashStr(id+'dis'+i)%9,
      baseFunny: hashStr(id+'fun'+i)%22
    });

}

    };
    if(type==='movie'){ item.box=r.box; item.director=r.director; item.composer=r.composer; item.writer=r.writer; item.actors=r.actors||[]; }
    if(type==='show'){ item.director=r.director; item.composer=r.composer; item.writer=r.writer; item.actors=r.actors||[]; }
    if(type==='game'){ item.developer=r.developer; }
    return item;
  });
}

let VOTES=loadVotes();
function voteCounts(review){
  const v=VOTES[review.id]||{};
  return {
    likes:(review.baseLikes||0)+(v.liked?1:0),
    dislikes:(review.baseDislikes||0)+(v.disliked?1:0),
    funny:(review.baseFunny||0)+(v.funny?1:0)
  };
}
function toggleVote(reviewId, kind){
  const v=Object.assign({liked:false,disliked:false,funny:false}, VOTES[reviewId]);
  if(kind==='like'){ v.liked=!v.liked; if(v.liked) v.disliked=false; }
  else if(kind==='dislike'){ v.disliked=!v.disliked; if(v.disliked) v.liked=false; }
  else if(kind==='funny'){ v.funny=!v.funny; }
  VOTES[reviewId]=v;
  saveVotes(VOTES);
}

function getUserReviews(username){
  const out=[];
  ['movie','show','game'].forEach(type=>{
    DB[type].forEach(item=>{
      allReviews(item).forEach(review=>{
        if(review.author===username) out.push({review,item,type});
      });
    });
  });
  return out.reverse();
}
function userAggregate(username){
  const entries=getUserReviews(username);
  let likes=0,dislikes=0,funny=0,scoreSum=0;
  entries.forEach(({review})=>{
    const c=voteCounts(review);
    likes+=c.likes; dislikes+=c.dislikes; funny+=c.funny; scoreSum+=review.score;
  });
  const avg=entries.length ? Math.round(scoreSum/entries.length) : 0;
  return {entries, likes, dislikes, funny, avg};
}

function allReviews(item){
  const own=(USER_REVIEWS[item.id]||[]).map((r,i)=>Object.assign({id:item.id+'-user-'+i, baseLikes:0, baseDislikes:0, baseFunny:0}, r));
  return item.seed.concat(own);
}
function liveScore(item){
  const revs=allReviews(item);
  const all=[item.baseScore, ...revs.map(r=>r.score)];
  const avg=all.reduce((a,b)=>a+b,0)/all.length;
  return Math.round(avg);
}

/* daily drop simulation: unshift one queued title per category once per ET calendar day after 20:00 */
function etNowParts(){
  const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false});
  const parts={}; fmt.formatToParts(new Date()).forEach(p=>parts[p.type]=p.value);
  return {dateKey:`${parts.year}-${parts.month}-${parts.day}`, hour:parseInt(parts.hour)};
}
function runDailyDrop(){
  const {dateKey,hour}=etNowParts();
  const last=localStorage.getItem('kritiq_lastDrop');
  if(hour<20 || last===dateKey) return;
  const added=loadAddedItems();
  ['movie','show','game'].forEach(type=>{
    const q=QUEUE[type];
    if(!q.length) return;
    const picked=q.shift();
    let item;
    const id=type[0]+'new'+dateKey+Math.floor(Math.random()*999);
    if(type==='movie'){
      const [title,box,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,box,baseScore:score,
        director:DIRECTORS[hashStr(title)%DIRECTORS.length],composer:COMPOSERS[hashStr(title)%COMPOSERS.length],
        writer:WRITERS[hashStr(title)%WRITERS.length],
        actors:[ACTORS[hashStr(title)%ACTORS.length],ACTORS[(hashStr(title)+3)%ACTORS.length],ACTORS[(hashStr(title)+5)%ACTORS.length],ACTORS[(hashStr(title)+7)%ACTORS.length]],
        seed:seedReviews(id,score), isNew:true};
    }else if(type==='show'){
      const [title,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,baseScore:score,
        director:DIRECTORS[hashStr(title)%DIRECTORS.length],composer:COMPOSERS[hashStr(title)%COMPOSERS.length],
        writer:WRITERS[hashStr(title)%WRITERS.length],
        actors:[ACTORS[hashStr(title)%ACTORS.length],ACTORS[(hashStr(title)+3)%ACTORS.length],ACTORS[(hashStr(title)+5)%ACTORS.length],ACTORS[(hashStr(title)+7)%ACTORS.length]],
        seed:seedReviews(id,score), isNew:true};
    }else{
      const [title,score]=picked;
      item={id,type,title,year:parseInt(dateKey.slice(0,4)),date:dateKey,baseScore:score,
        developer:DEVS[hashStr(title)%DEVS.length], seed:seedReviews(id,score), isNew:true};
    }
    DB[type].unshift(item);
    added[type].push(item);
  });
  localStorage.setItem('kritiq_lastDrop', dateKey);
  saveAddedItems(added);
}
function restoreAddedItems(){
  const added=loadAddedItems();
  ['movie','show','game'].forEach(type=>{
    added[type].forEach(it=>{ it.isNew=true; DB[type].unshift(it); });
  });
}

  const st=listState[type+'s'];
  const items=DB[type].filter(it=>it.year>=st.y0 && it.year<=st.y1);

function attachListEvents(type){
  const key=type+'s'; const st=listState[key];
  const y0=document.getElementById('y0'), y1=document.getElementById('y1');
  const sortSel=document.getElementById('sortSel');
  function updateFill(){
    const min=parseInt(y0.min), max=parseInt(y0.max);
    const lo=Math.min(+y0.value,+y1.value), hi=Math.max(+y0.value,+y1.value);
    const pct0=(lo-min)/(max-min)*100, pct1=(hi-min)/(max-min)*100;
    document.getElementById('rangeFill').style.left=pct0+'%';
    document.getElementById('rangeFill').style.width=(pct1-pct0)+'%';
    document.getElementById('yearReadout').textContent=lo+' – '+hi;
  }
  updateFill();
  bindLoadMore(type);
  [y0,y1].forEach(inp=>inp.addEventListener('input',()=>{
    st.y0=Math.min(+y0.value,+y1.value); st.y1=Math.max(+y0.value,+y1.value);
    st.page=1;
    updateFill();
    refreshListBody(type);
  }));
  sortSel.addEventListener('change',()=>{ st.sort=sortSel.value; st.page=1; refreshListBody(type); });
}
function refreshListBody(type){
  const body=listBodyHTML(type);
  document.getElementById('listBody').innerHTML=body.html;
  const {min:YMIN, max:YMAX}=YEAR_BOUNDS[type];
  document.getElementById('listSub').textContent=`${typeLabelPl(type)} z let ${YMIN}–${YMAX}. Zobrazeno ${body.shown} z ${body.total} položek.`;
  bindLoadMore(type);
}
function bindLoadMore(type){
  const btn=document.getElementById('loadMoreBtn');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    listState[type+'s'].page++;

  });
}

    USER_REVIEWS[item.id].push({author:'Vy', score:selected, text});
    saveUserReviews(USER_REVIEWS);
    route();
  });
}

function collectFilmography(name){
  const rows=[];
  ['movie','show'].forEach(type=>{
    DB[type].forEach(it=>{
      if(it.director===name || it.composer===name || it.writer===name || (it.actors&&it.actors.includes(name))){
        rows.push(it);
      }
    });
  });
  DB.game.forEach(it=>{ if(it.developer===name) rows.push(it); });
  const seen=new Set();
  return rows.filter(r=>{ if(seen.has(r.id))return false; seen.add(r.id); return true; })
             .sort((a,b)=>b.date.localeCompare(a.date));
}

function renderPerson(name){
  const filmo=collectFilmography(name);
  const isDev=DEVS.includes(name);
  const role=isDev?'Vývojářské studio':'Tvůrce / herec';
  const h=hashStr(name);
  const avatarStyle=`background:linear-gradient(135deg, hsl(${h%360} 60% 45%), hsl(${(h+70)%360} 65% 30%));`;
  const list=filmo.map(it=>{
    const sc=liveScore(it); const cls=scoreClass(sc);
    return `<a class="filmo-item" href="#/title/${it.type}/${it.id}" style="background:linear-gradient(90deg, color-mix(in srgb, var(--${cls==='s-black'?'s-black-bg':cls==='s-grey'?'s-grey-bg':cls==='s-blue'?'s-blue-bg':cls==='s-purple'?'s-purple-bg':'s-gold-bg'}) 16%, var(--bg-1)), var(--bg-1));">
      <span class="fi-title">${esc(it.title)}</span>
      <span class="fi-meta">${typeLabel(it.type)} · ${it.year}</span>
      <span class="fi-score ${cls}">${sc}</span>
    </a>`;
  }).join('');
  return `
    <div class="crumb"><a href="#/">Kritiq</a> / ${esc(name)}</div>
    <div class="person-head">
      <div class="person-avatar" style="${avatarStyle}">${esc(name.charAt(0))}</div>
      <div><h1 class="page-title" style="margin-bottom:2px;">${esc(name)}</h1><div class="person-role">${role}</div></div>
    </div>
    <h3 class="section-title">Filmografie (${filmo.length})</h3>
    <div class="filmo-list">${list || '<p class="empty-note">Žádné položky.</p>'}</div>
  `;
}

/* ======================= ROUTER ======================= */
function setActiveNav(route){
  document.querySelectorAll('#mainNav a').forEach(a=>{
    a.classList.toggle('active', route.startsWith(a.dataset.r));
  });
}
function route(){
  const hash=location.hash || '#/';
  const parts=hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const app=document.getElementById('app');
  setActiveNav(parts[0]||'');
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});

  if(parts.length===0){ app.innerHTML=renderHome(); return; }

  if(parts[0]==='movies'){ app.innerHTML=renderList('movie'); attachListEvents('movie'); return; }
  if(parts[0]==='shows'){ app.innerHTML=renderList('show'); attachListEvents('show'); return; }
  if(parts[0]==='games'){ app.innerHTML=renderList('game'); attachListEvents('game'); return; }

  if(parts[0]==='title' && parts[1] && parts[2]){
    app.innerHTML=renderDetail(parts[1],parts[2]);
    attachDetailEvents(parts[1],parts[2]);
    return;
  }
  if(parts[0]==='person' && parts[1]){
    app.innerHTML=renderPerson(decodeURIComponent(parts[1]));
    return;
  }
  if(parts[0]==='user' && parts[1]){
    app.innerHTML=renderUserProfile(decodeURIComponent(parts[1]));
    attachUserProfileEvents(decodeURIComponent(parts[1]));
    return;
  }
  if(parts[0]==='search' && parts[1]){
    app.innerHTML=renderSearch(decodeURIComponent(parts[1]));
    return;
  }
  app.innerHTML=renderHome();
}

/* ======================= INIT ======================= */
/* If a real, generated dataset (data.json) sits next to this file, it is used automatically.
   See the accompanying fetch_data.py script for how to generate a real, thousands-title
   data.json from TMDb (movies/shows) and RAWG (games) — drop the file next to kritiq.html
   and reload. Expected shape:
   { "movies":[{title,year,date,score,box,genre,director,composer,writer,actors:[]}, ...],
     "shows": [{title,year,date,score,genre,director,composer,writer,actors:[]}, ...],
     "games": [{title,year,date,score,genre,developer}, ...] }               */
async function loadRealData(){
  try{
    const res=await fetch('./data.json', {cache:'no-store'});
    if(!res.ok) return false;
    const json=await res.json();
    if(!json.movies || !json.shows || !json.games) return false;
    DB.movie=buildFromRecords(json.movies,'movie','m');
    DB.show=buildFromRecords(json.shows,'show','s');
    DB.game=buildFromRecords(json.games,'game','g');
    return true;
  }catch(e){ return false; }
}

let YEAR_BOUNDS={movie:{min:2021,max:2026}, show:{min:2021,max:2026}, game:{min:2021,max:2026}};
function computeYearBounds(){
  ['movie','show','game'].forEach(type=>{
    const years=DB[type].map(it=>it.year).filter(y=>Number.isFinite(y));
    if(years.length){ YEAR_BOUNDS[type]={min:Math.min(...years), max:Math.max(...years)}; }
  });
  listState.movies.y0=YEAR_BOUNDS.movie.min; listState.movies.y1=YEAR_BOUNDS.movie.max;
  listState.shows.y0=YEAR_BOUNDS.show.min; listState.shows.y1=YEAR_BOUNDS.show.max;
  listState.games.y0=YEAR_BOUNDS.game.min; listState.games.y1=YEAR_BOUNDS.game.max;
}

/* ======================= REVIEW MODAL ======================= */
/* ======================= MODAL STACK ======================= */
/* Each entry is a render function that redraws the current modal content into #reviewModalCard.
   Opening a new modal pushes onto the stack (previous stays underneath); the X button pops one
   level back to whatever was open before, and only empties + hides the overlay once the stack
   is empty. Backdrop click / Escape / navigating away clear the whole stack at once. */
let modalStack=[];
function pushModal(renderFn){
  modalStack.push(renderFn);
  renderTopModal();
}
function renderTopModal(){
  if(!modalStack.length) return;
  modalStack[modalStack.length-1]();
  document.getElementById('reviewModalOverlay').classList.add('open');
}
function popModal(){
  modalStack.pop();
  if(modalStack.length) renderTopModal();
  else closeAllModals();
}
function closeAllModals(){
  modalStack=[];
  document.getElementById('reviewModalOverlay').classList.remove('open');
}

function openReviewModalById(reviewId){
  const itemId=reviewId.split(/-(?:seed|user)-/)[0];
  const type=itemId.charAt(0)==='m'?'movie':itemId.charAt(0)==='s'?'show':'game';
  const item=findItem(type,itemId);
  if(!item) return;
  const review=allReviews(item).find(r=>r.id===reviewId);
  if(!review) return;
  pushModal(()=>renderModalCard(item, review));
}
function renderModalCard(item, review){
  const card=document.getElementById('reviewModalCard');
  const c=voteCounts(review);
  const v=VOTES[review.id]||{};
  card.className='modal-card';
  card.innerHTML=`
    <button class="modal-close" id="reviewModalCloseBtn" aria-label="Zavřít" type="button">✕</button>
    <div class="modal-review-head">
      <div class="modal-review-score ${scoreClass(review.score)}">${review.score}</div>
      <a class="modal-review-author profile-link" data-username="${esc(review.author)}" href="#/user/${slug(review.author)}">${esc(review.author)}</a>
    </div>
    <div class="modal-review-text">${esc(review.text)}</div>
    <div class="modal-react-row">
      <button class="react-btn ${v.liked?'active-like':''}" data-kind="like" type="button">${ICON_LIKE}<span>Líbí (${c.likes})</span></button>
      <button class="react-btn ${v.disliked?'active-dislike':''}" data-kind="dislike" type="button">${ICON_DISLIKE}<span>Nelíbí (${c.dislikes})</span></button>
      <button class="react-btn ${v.funny?'active-funny':''}" data-kind="funny" type="button">${ICON_FUNNY}<span>Vtipné (${c.funny})</span></button>
    </div>
  `;
  document.getElementById('reviewModalCloseBtn').addEventListener('click', popModal);
  card.querySelectorAll('.react-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      toggleVote(review.id, btn.dataset.kind);
      renderModalCard(item, review);
      const list=document.getElementById('reviewsList');
      if(list) list.innerHTML=reviewsListHTML(item);
      const userList=document.getElementById('userReviewsList');
      if(userList && userProfileCurrent) refreshUserReviews(userProfileCurrent);
    });
  });
}

function openGalleryModal(item){

    card.className='modal-card wide';

      <button class="modal-close" id="galleryCloseBtn" aria-label="Zavřít" type="button">✕</button>
      <h3 class="section-title" style="margin-bottom:14px;">${esc(item.title)} — galerie</h3>
      <div class="gallery-scroll">${photos.map((st,i)=>`<div class="gallery-photo" style="${st}"><span class="gallery-photo-label">${esc(item.title.charAt(0))}${i+1}</span></div>`).join('')}</div>
    `;
    document.getElementById('galleryCloseBtn').addEventListener('click', popModal);

}

const FAV_PAGE_SIZE=10;
let favModalState={username:null, page:1};
function openFavoritesModal(username){
  favModalState={username, page:1};
  pushModal(renderFavoritesModal);
}
function favoritesForUser(username){
  const list = username==='Vy' ? loadMyFavorites() : (FAVORITES_SEED[username]||[]);
  return list.map(u=>({username:u, agg:userAggregate(u)}))
    .sort((a,b)=>(b.agg.likes+b.agg.funny)-(a.agg.likes+a.agg.funny));
}
function renderFavoritesModal(){
  const {username, page}=favModalState;
  const card=document.getElementById('reviewModalCard');
  const enriched=favoritesForUser(username);
  const shown=enriched.slice(0, page*FAV_PAGE_SIZE);
  const rows=shown.map((e,i)=>`
    <a class="fav-row profile-link" data-username="${esc(e.username)}" href="#/user/${slug(e.username)}">
      <span class="fav-rank">${i+1}</span>
      <span class="fav-avatar" style="${avatarStyle(e.username)}">${esc(e.username.charAt(0))}</span>
      <span class="fav-name">${esc(e.username)}</span>
      <span class="fav-mini">${ICON_LIKE}${e.agg.likes}${ICON_FUNNY}${e.agg.funny}</span>
    </a>`).join('');
  const remaining=enriched.length-shown.length;
  const more=remaining>0 ? `<div class="load-more-wrap"><button class="load-more-btn" id="favMoreBtn">Zobrazit dalších ${Math.min(FAV_PAGE_SIZE,remaining)}</button></div>` : '';
  card.className='modal-card';
  card.innerHTML=`
    <button class="modal-close" id="favCloseBtn" aria-label="Zavřít" type="button">✕</button>
    <h3 class="section-title" style="margin-bottom:14px;">Oblíbení uživatelé — ${esc(username)}</h3>
    ${enriched.length ? `<div class="fav-list">${rows}</div>${more}` : `<p class="empty-note">Zatím nikoho nemá v oblíbených.</p>`}
  `;
  document.getElementById('favCloseBtn').addEventListener('click', popModal);
  const moreBtn=document.getElementById('favMoreBtn');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{ favModalState.page++; renderFavoritesModal(); });
}

  });

function copyProfileLink(username, btnEl){
  const url=location.origin+location.pathname+'#/user/'+encodeURIComponent(username);
  const done=()=>{
    const original=btnEl.innerHTML;
    btnEl.innerHTML=ICON_CHECK;
    btnEl.classList.add('copied');
    setTimeout(()=>{ btnEl.innerHTML=original; btnEl.classList.remove('copied'); }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  }else{
    fallbackCopy(url,done);
  }
}
function fallbackCopy(text, cb){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    if(cb) cb();
  }catch(e){}
}

/* ======================= SEARCH PANEL ======================= */
function initSearchPanel(){
  const toggleBtn=document.getElementById('searchToggle');
  const panel=document.getElementById('searchPanel');
  const input=document.getElementById('searchPanelInput');
  const results=document.getElementById('searchPanelResults');

  function closePanel(){ panel.classList.remove('open'); toggleBtn.classList.remove('active'); }
  function openPanel(){
    panel.classList.add('open'); toggleBtn.classList.add('active');
    setTimeout(()=>input.focus(), 60);
  }
  function renderResults(q){
    if(!q){ results.innerHTML=''; return; }
    const query=q.toLowerCase();
    const matches=[...DB.movie,...DB.show,...DB.game].filter(it=>it.title.toLowerCase().includes(query));
    if(!matches.length){ results.innerHTML=`<div class="search-empty-note">Nic jsme nenašli pro "${esc(q)}".</div>`; return; }
    const top=matches.slice(0,20);
    results.innerHTML=top.map(it=>{
      const sc=liveScore(it); const cls=scoreClass(sc);
      const meta=it.type==='movie' ? `${fmtBox(it.box)} · ${it.year}` : `${it.year}`;
      return `<a class="search-result-row" href="#/title/${it.type}/${it.id}"><span class="srr-title">${esc(it.title)}</span><span class="srr-meta">${typeLabel(it.type)} · ${meta}</span><span class="srr-score ${cls}">${sc}</span></a>`;
    }).join('');
  }

  toggleBtn.addEventListener('click', ()=>{
    if(panel.classList.contains('open')) closePanel();
    else { openPanel(); renderResults(input.value.trim()); }
  });
  input.addEventListener('input', ()=> renderResults(input.value.trim()));
  document.addEventListener('click', e=>{
    if(panel.classList.contains('open') && !panel.contains(e.target) && !toggleBtn.contains(e.target)) closePanel();
  });
  window.addEventListener('hashchange', closePanel);
  window._closeSearchPanel=closePanel;
}

async function init(){
  const loadedReal = await loadRealData();
  if(!loadedReal){
    DB.movie=buildMovies();
    DB.show=buildShows();
    DB.game=buildGames();
  }
  restoreAddedItems();
  runDailyDrop();
  computeYearBounds();

  initSearchPanel();

  document.addEventListener('click', e=>{
    const profileLink=e.target.closest('.profile-link');
    if(profileLink){ e.preventDefault(); openUserModal(profileLink.dataset.username); return; }
    if(e.target.closest('.no-modal-trigger')) return;
    const reviewEl=e.target.closest('.review-item');
    if(reviewEl){ openReviewModalById(reviewEl.dataset.reviewId); return; }
  });
  document.getElementById('reviewModalOverlay').addEventListener('click', e=>{
    if(e.target.id==='reviewModalOverlay') closeAllModals();
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeAllModals(); if(window._closeSearchPanel) window._closeSearchPanel(); }
  });
  window.addEventListener('hashchange', closeAllModals);

  window.addEventListener('hashchange', route);
  route();
}
init();
